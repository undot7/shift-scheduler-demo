function calHtml(y, m, cellFn, onclickName){
  const first = new Date(y, m, 1).getDay();
  const n = dim(y, m);
  let cells = DOWJ.map((w,i) => `<div class="dow ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join("");
  for(let i=0;i<first;i++) cells += `<div class="day blank"></div>`;
  const tds = todayStr();
  for(let d=1; d<=n; d++){
    const ds = dstr(y, m, d);
    const g = parseD(ds).getDay();
    const cls = `day ${g===0?'sun':g===6?'sat':''} ${ds===tds?'today':''}`;
    cells += `<div class="${cls}" onclick="${onclickName}('${ds}')"><span class="dn">${d}</span>${cellFn(ds)}</div>`;
  }
  return `<div class="cal">${cells}</div>`;
}

function staffShiftTab(me){
  // 下部タブは増やさず、タブ内のセグメント切替で「自分のシフト / 店舗全体」を出し分ける
  const seg = `<div class="seg" style="margin-bottom:10px;">
    <button class="${ui.staffShiftView==='store'?'':'on'}" onclick="A.staffShiftView('mine')">自分のシフト</button>
    <button class="${ui.staffShiftView==='store'?'on':''}" onclick="A.staffShiftView('store')">店舗全体</button>
  </div>`;
  // 店舗全体は店長の月間シフト表を読み取り専用(公開済みのみ)で再利用する
  if(ui.staffShiftView === "store")
    return seg + managerHtml(me.storeId, false, { meId: me.id, monthOffset: ui.staffCalOffset });

  const [y, m] = monthAt(ui.staffCalOffset);
  const st = storeOf(me.storeId);
  // 公開済みの月は「割当のない日=公休」。未公開の月は空欄のまま(まだ休みが確定していない)
  const pubMonth = isPublishedMonth(me.storeId, ymKey(y, m));
  const cell = ds => {
    const leaveChip = isLeave(reqAt(me.id, ds)) ? `<span class="chip leave">有給</span>` : "";
    const sh = shiftAt(me.id, ds);
    // 有給の日にシフトが入っていることもある(店長が後から入れた等)。
    // 本人が気づけないと困るのでシフトを優先して出し、有給は併記する。
    // 在籍期間外(入社前・退職後)の日も、データが残っていれば店長グリッドと同じものを出す
    // (本人にだけ見えないと「店舗全体タブでは見えるのに自分のシフトでは見えない」食い違いになる)。
    // 何も無い日だけ「公休」ではなく在籍外の表記にする。
    // 在籍外の判定は有給チップより先に行う(店長グリッドの分岐順と揃える。
    // 先に有給を出すと、同じ日が店長グリッドでは「—」・本人カレンダーでは「有給」と食い違う)
    if(!sh || sh.status !== "published")
      return !activeOn(me, ds)
        ? `<span class="chip ghost na">—</span>`
        : (leaveChip || (pubMonth ? `<span class="chip ghost">公休</span>` : ""));
    const p = sh.patternId ? patternOf(sh.patternId) : null;
    if(p && p.start === sh.start && p.end === sh.end)
      // pr-time: 印刷時のみ表示。白黒でもパターンを判別できるよう時刻を必ず併記する
      return `<span class="chip cal-pt" style="background:${p.color}; --c:${p.color}">${esc(p.name)}<small class="pr-time">${sh.start}-${sh.end}</small></span>${leaveChip}`;
    // 開始/終了を別要素にして画面では2行・印刷では従来どおり1行(cs-end::before の "-")にする
    return `<span class="chip cal-sh" style="background:${st.color}; --c:${st.color}">${sh.start}<small class="cs-end">${sh.end}</small></span>${leaveChip}`;
  };
  return seg + `<div class="card">
    <div class="print-head">
      <div class="ph-ttl">${esc(me.name)}さんのシフト　${y}年${m+1}月</div>
      <div class="ph-meta">${esc(st.name)}　／　出力日時: <span id="print-stamp">${stampStr()}</span>　／　公開済みのシフトのみ記載</div>
    </div>
    <div class="cal-head">
      <button class="btn btn-sm" onclick="A.staffCal(-1)">‹ 前月</button>
      <span class="ttl">${y}年${m+1}月のシフト</span>
      <button class="btn btn-sm" onclick="A.staffCal(1)">翌月 ›</button>
    </div>
    ${calHtml(y, m, cell, "A.staffDay")}
    <p class="small muted no-print" style="margin:8px 0 0;">公開済みのシフトのみ表示されます。日付をタップするとその日の店舗全体の体制が見られます。</p>
    <div class="pr-bar"><button class="btn btn-sm" onclick="A.printSheet()">🖨 このシフトを印刷</button></div>
  </div>`;
}

function staffReqTab(me){
  const [y, m] = monthAt(1);
  const cell = ds => {
    const r = reqAt(me.id, ds);
    // 在籍期間外(入社前・退職後)の日。希望が残っていればそれを出し、
    // 何も無い日だけ在籍外の表記にする(店長グリッド・自分のシフトと分岐順を揃える)
    if(!r) return activeOn(me, ds) ? "" : `<span class="chip ghost na">—</span>`;
    // cal-rq: スマホ幅だとマスに収まらず省略されるので折り返し可にする。
    // 時間・パターン希望は途中で不自然に折れないよう2要素に分け、画面は2行・印刷は1行に戻す
    if(r.type === "day_off") return `<span class="chip ghost cal-rq">希望休</span>`;
    if(r.type === "paid_leave") return `<span class="chip leave">有給</span>`;
    if(r.type === "time") return `<span class="chip ghost cal-rq rq-tm">${r.start}<small class="cs-end">${r.end}</small></span>`;
    if(r.type === "pattern"){ const p = patternOf(r.patternId); return `<span class="chip ghost cal-rq">${esc(p?p.name:"?")}<small class="rq-sfx">希望</small></span>`; }
    return `<span class="chip ghost cal-rq">${anyLabel(r.storeId)}</span>`;
  };
  const myReqs = state.requests.filter(r => r.userId === me.id && ymOf(r.date) === ymKey(y,m))
    .sort((a,b) => a.date < b.date ? -1 : 1);
  const offN = dayOffCount(me.id, ymKey(y, m));
  const list = myReqs.length ? myReqs.map(r => `<div class="req-item">
      <b>${jdate(r.date)}</b><span>${reqLabel(r)}</span>
      <span style="flex:1"></span><span class="muted small">提出済み</span>
    </div>`).join("") : `<p class="small muted">まだ希望を提出していません。</p>`;
  return `<div class="card">
    <div class="cal-head"><span class="ttl">${y}年${m+1}月の希望提出</span></div>
    ${calHtml(y, m, cell, "A.openReq")}
    <p class="small muted" style="margin:8px 0 0;">日付をタップして希望休・有給・希望時間を提出できます（提出済みの日は修正・取り下げ可）。</p>
  </div>
  <div class="card"><h2 class="sec">提出済みの希望</h2>
    <p class="small ${offN >= MAX_DAY_OFF ? "" : "muted"}">希望休 ${offN} / ${MAX_DAY_OFF}日（有給は上限に含みません）</p>
    <div class="req-list">${list}</div></div>`;
}

function reqLabel(r){
  if(r.type === "day_off") return "希望休";
  if(r.type === "paid_leave") return "有給";
  if(r.type === "time") return `時間指定 ${r.start}〜${r.end}`;
  if(r.type === "pattern"){ const p = patternOf(r.patternId); return `${p ? esc(p.name) : "?"}を希望`; }
  return anyLabel(r.storeId);
}
// type:"any" の表示文言(パターン制=どちらでも / 自由時間制=終日可)
function anyLabel(storeId){ const st = storeOf(storeId); return st && st.mode === "pattern" ? "どちらでも" : "終日可"; }

function staffNtfTab(me){
  const list = state.notifications.filter(n => n.userId === me.id).sort((a,b) => b.id - a.id);
  const rows = list.length ? list.map(n => `<div class="ntf ${n.read?'read':''}" onclick="A.readNtf(${n.id})">
      <span class="ndot"></span>
      <div><div class="nt">${esc(n.title)}</div><div class="nb">${esc(n.body)}</div>
      <div class="nd">${ntfTime(n.createdAt)}</div></div>
    </div>`).join("") : `<p class="small muted">通知はありません。</p>`;
  return `<div class="card"><h2 class="sec">通知</h2>${rows}</div>`;
}

/* ---------------- 店長画面(オーナーの店舗ドリルインと共用) ---------------- */
/* ro(第3引数): スタッフの「店舗全体」ビュー = 読み取り専用 { meId, monthOffset }
   - 公開済み(status:"published")のシフトだけを描く。下書きは1件も出さない
   - セルは編集不可。自動生成・公開・条件設定・CSV・扶養(給与)情報は一切出さない
   ※描画を作り直すとA4横1枚に収まる実測が無効になるので、必ずこの関数を再利用する */
function managerHtml(storeId, fromOwner, ro){
  if(!ro && ui.mgrScreen === "conditions") return condHtml(storeId, fromOwner);
  const st = storeOf(storeId);
  const [y, m] = monthAt(ro ? ro.monthOffset : ui.mgrMonthOffset);
  const ym = ymKey(y, m);
  // その月に在籍していた人＋その月に実績(シフト・希望)がある人。
  // これで「退職日以降は一覧・印刷から外れ、在籍していた過去月では従来どおり表示」が成立する
  const mem = membersFor(storeId, y, m);
  const nDays = dim(y, m);
  const tds = todayStr();

  const monthShifts = state.shifts.filter(s => s.storeId === storeId && ymOf(s.date) === ym);
  const hasDraft = monthShifts.some(s => s.status === "draft");
  const hasPub = monthShifts.some(s => s.status === "published");
  const stChip = hasPub && !hasDraft ? `<span class="st-chip st-pub">公開済み</span>`
    : hasDraft ? `<span class="st-chip st-draft">下書きあり</span>`
    : `<span class="st-chip st-none">未作成</span>`;
  // 印刷時の状態表記。下書きは確定版との取り違えを防ぐため紙面に必ず明示する
  const prState = hasDraft ? "下書き" : hasPub ? "公開済み" : "未作成";
  // 読み取り専用ビューは「公開済みの月」だけ中身を出す(未公開の月は表そのものを出さない)
  const roPub = !!ro && isPublishedMonth(storeId, ym);
  // シフト作成済み(自動生成/公開を行った)の月だけ「割当なし=公休」と表示する。
  // シフト件数では判定しない(手動で1セル入れただけの月が完成シフト表に見えてしまうため)
  const made = ro ? roPub : isMadeMonth(storeId, ym);

  let head = `<th class="name-col" data-pstate="${ro ? (roPub ? "公開済み" : "") : prState}">スタッフ</th>`;
  for(let d=1; d<=nDays; d++){
    const ds = dstr(y, m, d); const g = parseD(ds).getDay();
    head += `<th class="${ds===tds?'today':''}">${d}<span class="dw ${g===0?'sun':g===6?'sat':''}">${DOWJ[g]}</span></th>`;
  }

  const rows = mem.map(u => {
    const isMe = !!ro && u.id === ro.meId;
    // 扶養内のスタッフは、この月の見込みで上限を超えそうなら名前の下に警告を出す(表示のみ・自動生成の制約には入れていない)
    // ※給与に関わる情報なので、読み取り専用ビュー(他のスタッフが見る)と、
    //   時給・扶養の閲覧権限が無い段のロール(副店長など)には出さない
    const fw = (!ro && vcan("wage") && fuyouTarget(u) && fuyouOf(u, y, m).over) ? `<small class="fw">⚠扶養超過見込み</small>` : "";
    let tds2 = ro
      ? `<td class="name-col"><b>${esc(u.name)}${isMe?`<span class="me-tag">あなた</span>`:""}</b><small>${esc(u.type)}</small></td>`
      : `<td class="name-col clk" onclick="A.openUser(${u.id})"><b>${esc(u.name)}</b><small>${esc(u.type)}${u.weeklyMaxDays?`・週${u.weeklyMaxDays}日まで`:""}</small>${fw}<small class="gear">⚙ 個人設定</small></td>`;
    for(let d=1; d<=nDays; d++){
      const ds = dstr(y, m, d);
      let sh = shiftAt(u.id, ds);
      // 読み取り専用ビューでは下書きを1件も見せない
      // (公開済みの月に店長が後から入れた下書きも含めて落とす)
      if(ro && sh && sh.status !== "published") sh = null;
      // 未公開の月は希望(有給・希望休など)も見せない
      const rq = (ro && !roPub) ? null : reqAt(u.id, ds);
      let inner = "", conflict = "";
      if(sh){
        const p = sh.patternId ? patternOf(sh.patternId) : null;
        const draftCls = sh.status === "draft" ? " draft" : "";
        if(p){
          const custom = (p.start !== sh.start || p.end !== sh.end) ? `<small class="sc-adj">${sh.start}-${sh.end}</small>` : "";
          // pr-time: 印刷時のみ表示。白黒でもパターンを判別できるよう時刻を必ず併記する
          inner = `<span class="sh-chip${draftCls}" style="background:${p.color}; --c:${p.color}">${esc(p.name)}${custom}<small class="pr-time">${sh.start}<br>${sh.end}</small></span>`;
        }else{
          inner = `<span class="sh-chip free-sh${draftCls}" style="--c:${st.color}">${sh.start}<small>${sh.end}</small></span>`;
        }
        // 希望と食い違う日の警告枠は店長向け。スタッフの閲覧ビューには出さない
        if(!ro && rq && (rq.type === "day_off" || rq.type === "paid_leave")) conflict = " conflict";
        // 退職日を後から入れた等で在籍期間外にシフトが残っている日。店長が見つけて掃除できるようにする
        if(!ro && !activeOn(u, ds)) conflict = " conflict";
      }else if(!activeOn(u, ds)){
        // 在籍期間外の日は「公休」と出さない(休みを与えているように見えるため)。
        // 「割当のない日は必ず公休/有給で埋める」仕様の唯一の例外
        inner = `<span class="off-chip na">—</span>`;
      }else if(rq && rq.type === "paid_leave"){
        inner = `<span class="off-chip leave">有給</span>`;
      }else if(made){
        // 作成済みの月で割当がない日は、希望の有無にかかわらず「公休」。
        // 希望の文字(希望休/10:00-15:00 等)を残すと紙面で勤務日と誤読されるため必ず公休にする。
        // 由来が分かる補助表示は画面のみ(印刷では .oc-sub を非表示)。
        // 店長向けの情報なので、スタッフの閲覧ビュー(ro)にも出さない
        let sub = "";
        if(rq && !ro) sub = rq.type === "day_off"
          ? `<small class="oc-sub">希望</small>`      // 希望休が通った日
          : `<small class="oc-sub">希望未反映</small>`; // 勤務希望を出したが割当がなかった日
        inner = `<span class="off-chip">公休${sub}</span>`;
      }else if(rq){
        // 未作成の月は「まだ休みが確定していない」ので、提出された希望だけを見せる
        if(rq.type === "day_off") inner = `<span class="off-chip">希望休</span>`;
        else if(rq.type === "time") inner = `<span class="rq">希望<br>${rq.start}<br>${rq.end}</span>`;
        else if(rq.type === "pattern"){ const p = patternOf(rq.patternId); inner = `<span class="rq">${esc(p?p.name:"?")}<br>希望</span>`; }
        else inner = `<span class="rq">${anyLabel(storeId)}</span>`;
      }
      // 読み取り専用: onclickを付けない(セルをタップしても編集モーダルは開かない)
      tds2 += ro
        ? `<td class="cell ro">${inner}</td>`
        : `<td class="cell${conflict}" onclick="A.openCell(${storeId},${u.id},'${ds}')">${inner}</td>`;
    }
    return `<tr${isMe?` class="me-row"`:""}>${tds2}</tr>`;
  }).join("");

  // 人員不足バッジ(tfoot)は店長向けの指標。スタッフの閲覧ビューには出さない
  let foot = "";
  if(!ro && monthShifts.length){
    foot = `<tfoot><tr><td class="name-col small muted">人員</td>`;
    for(let d=1; d<=nDays; d++){
      const ds = dstr(y, m, d);
      foot += `<td>${isShortDay(storeId, ds) ? `<span class="short-badge">⚠️不足</span>` : `<span class="muted">✓</span>`}</td>`;
    }
    foot += `</tr></tfoot>`;
  }

  const gridHtml = `<div class="grid-wrap">
    <table class="grid"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody>${foot}</table>
  </div>`;

  /* ----- スタッフの「店舗全体」ビュー(読み取り専用) ----- */
  if(ro){
    // 未公開の月は表も印刷見出しも出さない(下書きが紙に出る経路を作らない)
    const roHead = roPub ? `<div class="print-head">
      <div class="ph-ttl">${esc(st.name)}　${y}年${m+1}月 シフト表</div>
      <div class="ph-meta">${esc(state.tenant.name)}　／　出力日時: <span id="print-stamp">${stampStr()}</span>　／　公開済みのシフトのみ記載</div>
    </div>` : "";
    return `
    ${roHead}
    <div class="mgr-toolbar">
      <button class="btn btn-sm" onclick="A.staffCal(-1)">‹ 前月</button>
      <span style="font-weight:700;">${y}年${m+1}月</span>
      <button class="btn btn-sm" onclick="A.staffCal(1)">翌月 ›</button>
      <span style="flex:1"></span>
      ${roPub ? `<button class="btn btn-sm" onclick="A.printSheet()">🖨 全体を印刷</button>` : ""}
    </div>
    ${roPub ? gridHtml
      : `<div class="card"><p class="small muted" style="margin:0;">
          ${y}年${m+1}月のシフトはまだ公開されていません。公開されると通知でお知らせします。</p></div>`}
    ${roPub ? `<p class="small muted no-print" style="margin-top:8px;">
      ${esc(st.name)}の公開済みシフトです（閲覧のみ・編集はできません）。
      青い行があなたのシフトです。横にスクロールすると月末まで見られます。</p>` : ""}`;
  }

  // 扶養(給与情報)は閲覧権限のある段のロールにだけ出す
  const overN = vcan("wage") ? fuyouOverMembers(storeId, y, m).length : 0;
  // 公休が設定より多くなっている人(社員・店長)を1行で知らせる。
  // 生成で埋めきれなかった分と、手動でシフトを削除した分の両方がここに出る。
  // 描画のたびに計算する(生成時だけだと手動編集の結果と食い違う)。
  // ※この定義は必ず ro(スタッフの店舗全体ビュー)の早期 return より後に置くこと
  const overs = made ? daysOffOverIn(storeId, y, m) : [];
  const overBar = overs.length ? `<div class="off-over-bar no-print">⚠ 公休が設定より多い: ${
      overs.slice(0, 5).map(o => `${esc(o.u.name)}(+${o.over})`).join(" ")
    }${overs.length > 5 ? ` ほか${overs.length - 5}名` : ""}</div>` : "";
  const backBtn = fromOwner ? `<button class="btn btn-sm" onclick="A.ownerBack()">‹ ダッシュボード</button>` : "";
  // 来月のみ操作可・無効化した店舗はシフトを作らない。公開は publish 権限のある段だけ
  const canOp = ui.mgrMonthOffset === 1 && !st.archived;
  // いま表示している月の公休日数。ここから直接その月だけを変えられる。
  // 表示条件は自動生成と同じ canOp にそろえる:
  //  「変更しても、その画面で作り直せない月」では変更させない
  const offNow = monthlyDaysOffIn(state, storeId, y, m);
  const offOvr = hasMonthlyOverride(state, storeId, y, m, "monthlyDaysOff");
  const offBtn = canOp
    ? `<button class="btn btn-sm" onclick="A.openMonthDaysOff(${storeId})">公休 ${
        offNow == null ? "未設定" : offNow + "日"}${offOvr ? "（この月のみ）" : ""}</button>`
    : "";
  const nextBtns =
    (canOp ? `<button class="btn" onclick="A.generate(${storeId})">✨ 自動生成</button>\n       ` : "")
    + ((canOp && vcan("publish")) ? `<button class="btn btn-primary" onclick="A.publish(${storeId})">📢 シフトを公開</button>` : "");
  const reqCount = state.requests.filter(r => r.storeId === storeId && ymOf(r.date) === ym).length;

  const printHead = `<div class="print-head">
    <div class="ph-ttl">${prState === "下書き" ? `<span class="ph-draft">下書き（未公開）</span>` : ""}${esc(st.name)}　${y}年${m+1}月 シフト表</div>
    <div class="ph-meta">${esc(state.tenant.name)}　／　状態: ${prState === "下書き" ? "下書き（未公開・確定版ではありません）" : prState}　／　出力日時: <span id="print-stamp">${stampStr()}</span></div>
  </div>`;

  return `
  ${printHead}
  <div class="mgr-toolbar">
    ${backBtn}
    <span style="font-weight:700; font-size:15px;"><span class="store-dot" style="display:inline-block;background:${st.color}"></span> ${esc(st.name)}</span>
    <span class="st-chip ${st.mode==='pattern'?'st-none':'st-none'}">${st.mode === "pattern" ? "パターン制" : "自由時間制"}</span>
    ${st.archived ? `<span class="st-chip st-none">無効化済み</span>` : ""}
    ${overN ? `<span class="fw-chip">⚠ 扶養超過見込み ${overN}名</span>` : ""}
    <span style="flex:1"></span>
    ${st.archived ? "" : `<button class="btn btn-sm" onclick="A.mgrConditions(${storeId})">⚙ 条件設定</button>`}
  </div>
  <div class="mgr-toolbar">
    <div class="seg">
      <button class="${ui.mgrMonthOffset===0?'on':''}" onclick="A.mgrMonth(0)">今月</button>
      <button class="${ui.mgrMonthOffset===1?'on':''}" onclick="A.mgrMonth(1)">来月</button>
    </div>
    <span style="font-weight:700;">${y}年${m+1}月</span>
    ${stChip}
    ${offBtn}
    <span class="small muted">希望 ${reqCount}件</span>
    <span style="flex:1"></span>
    <button class="btn btn-sm" onclick="A.printSheet()">🖨 印刷</button>
    <button class="btn btn-sm" onclick="A.exportCsv(${storeId})">⬇ CSVダウンロード</button>
    ${nextBtns}
  </div>
  ${overBar}
  ${gridHtml}
  <p class="small muted no-print" style="margin-top:8px;">
    セルをタップして手動入力・編集できます（スタッフ名をタップすると<b>個人設定</b>）。点線の枠は下書き（未公開）です。
    シフト表を作成すると、割当のない日は「公休」（希望休が通った日は「公休/希望」）、有給の日は「有給」と表示されます
    （有給は自動生成の対象外・公休日数にも含みません）。未作成の月は、スタッフから提出された希望だけがグレーで表示されます。
  </p>`;
}

/* ---------------- 条件設定 ---------------- */
function condHtml(storeId, fromOwner){
  const st = storeOf(storeId);
  const c = ui.condDraft;
  const numRow = (label, key) =>
    `<div class="frow"><label>${label}</label>
     <input type="number" min="0" value="${c[key] ?? ""}" onchange="A.condField('${key}', this.value)"></div>`;
  let modeArea = "";
  if(st.mode === "pattern"){
    const pats = storePatterns(storeId);
    // 割合はパターンIDをキーに持つ(共通設定で名前を変えても崩れない)。
    // 合計が100でなくても・未設定のパターンが混ざっても成立するよう、正規化した「実効」値を併記する
    const tg = patternTargets(pats, c.patternRatio);
    const sum = pats.reduce((a,p) => a + (((c.patternRatio||{})[p.id] != null) ? Number((c.patternRatio||{})[p.id]) || 0 : 0), 0);
    modeArea = `<h2 class="sec">パターン割合（%）</h2>` + (pats.length ? pats.map(p =>
      `<div class="frow"><label>${esc(p.name)}（${p.start}〜${p.end}）</label>
       <input type="number" min="0" max="100" value="${(c.patternRatio||{})[p.id] ?? ""}" onchange="A.condRatio(${p.id}, this.value)"> %
       <span class="small muted">実効 ${tg[p.id].toFixed(1)}%</span></div>`).join("")
      + `<p class="small muted" style="margin:2px 0 0;">入力の合計は ${sum}%（未設定のパターンは均等割り）。
         合計が100%でなくても<b>比率として正規化</b>して使うので、パターンを追加・削除しても崩れません。実際に使われるのは右の「実効」値です。</p>`
      : `<p class="small muted">この店舗で使うパターンが未選択です（オーナーの「共通設定」で選びます）。</p>`);
  }else{
    const rows = (c.hourlyHeadcount || []).map((b, i) =>
      `<div class="band-row">
        ${timeSel(`A.bandField(${i},'from',this.value)`, b.from)} 〜 ${timeSel(`A.bandField(${i},'to',this.value)`, b.to)}
        <input type="number" min="0" style="width:64px;" class="tsel" value="${b.count}" onchange="A.bandField(${i},'count',this.value)"> 人
        <button class="btn btn-sm btn-danger" onclick="A.bandDel(${i})">✕</button>
      </div>`).join("");
    modeArea = `<h2 class="sec">時間帯別 必要人数</h2>${rows}
      <button class="btn btn-sm" onclick="A.bandAdd()">＋ 時間帯を追加</button>`;
  }
  /* 月別の公休日数(上書き)。設定できるのは来月以降だけ */
  const [ny1, nm1] = monthAt(1);
  const nextYm = ymKey(ny1, nm1);
  const movr  = c.monthly || {};
  const movrKeys = Object.keys(movr)
    .filter(k => movr[k] && movr[k].monthlyDaysOff != null).sort();
  const movrRows = movrKeys.map(k => {
    const ay = Number(k.slice(0,4)), am = Number(k.slice(5,7)) - 1;
    const locked = k < nextYm;   // 当月・過去月。値は使い続けるが変更はさせない
    return `<div class="frow${locked ? " ms-off" : ""}">
      <label>${ay}年${am+1}月</label>
      <input type="number" min="0" max="${dim(ay, am)}" value="${movr[k].monthlyDaysOff}"
        ${locked ? "disabled" : `onchange="A.monthOffField('${k}', this.value)"`}> 日
      ${locked ? `<span class="small muted">当月・過去月のため変更できません</span>`
               : `<button class="btn btn-sm btn-danger" onclick="A.monthOffDel('${k}')">✕</button>`}
    </div>`;
  }).join("");
  // 追加候補は来月〜12ヶ月先のうち、まだ上書きが無い月
  let movrOpts = "";
  for(let i = 1; i <= 12; i++){
    const [ay, am] = monthAt(i); const k = ymKey(ay, am);
    if(movrKeys.includes(k)) continue;
    movrOpts += `<option value="${k}">${ay}年${am+1}月</option>`;
  }
  const movrArea = `<h2 class="sec">月別の公休日数（上書き）</h2>
    <p class="small muted" style="margin:0 0 8px;">設定した月だけ、上の「月の公休日数」より<b>優先</b>されます。
    設定していない月は上の既定値が使われます。<b>来月以降だけ</b>設定できます
    （シフト表を作り直せるのが来月だけのため）。
    変更しても自動的に作り直しはしません（「✨ 自動生成」を押し直すと反映されます）。</p>
    ${movrRows || `<p class="small muted" style="margin:0 0 8px;">月別の上書きはありません。</p>`}
    ${movrOpts ? `<div class="frow">
      <select class="tsel" id="cd-movr-add">${movrOpts}</select>
      <button class="btn btn-sm" onclick="A.monthOffAdd()">＋ 月を追加</button></div>` : ""}`;
  return `<div class="mgr-toolbar">
    <button class="btn btn-sm" onclick="A.mgrGrid()">‹ シフト表へ戻る</button>
    <span style="font-weight:700;">${esc(st.name)}｜条件設定</span>
  </div>
  <div class="card">
    ${numRow("月の公休日数", "monthlyDaysOff")}
    ${numRow("最大連勤（日）", "maxConsecutive")}
    ${numRow("平日の必要人数", "weekdayHeadcount")}
    ${numRow("土日の必要人数", "weekendHeadcount")}
    ${modeArea}
    ${movrArea}
    <div style="margin-top:14px;"><button class="btn btn-primary" onclick="A.saveConditions(${storeId})">保存する</button></div>
  </div>`;
}

function timeSel(onchange, val){
  let opts = "";
  for(let t = 360; t <= 1440; t += 30){
    const v = mt(t);
    opts += `<option value="${v}" ${v===val?"selected":""}>${v}</option>`;
  }
  return `<select class="tsel" onchange="${onchange}">${opts}</select>`;
}

/* ---------------- オーナー画面 ---------------- */
function ownerHtml(){
  const [ny, nm] = monthAt(1);
  const nYm = ymKey(ny, nm);
  const cards = activeStores().map(st => {
    const shs = state.shifts.filter(s => s.storeId === st.id && ymOf(s.date) === nYm);
    const hasDraft = shs.some(s => s.status === "draft");
    const hasPub = shs.some(s => s.status === "published");
    const status = hasPub && !hasDraft ? `<span class="st-chip st-pub">公開済み</span>`
      : hasDraft ? `<span class="st-chip st-draft">下書き</span>` : `<span class="st-chip st-none">未作成</span>`;
    const reqN = state.requests.filter(r => r.storeId === st.id && ymOf(r.date) === nYm).length;
    // 退職者は店長として出さない(視点選択の店長ボタンと表示が食い違うため。どちらも !retired で揃える)
    const mg = membersFor(st.id, ny, nm).find(u => u.role === "manager" && !retired(u));
    const over = fuyouOverMembers(st.id, ny, nm);
    return `<div class="card own-card" onclick="A.ownerOpen(${st.id})">
      <span class="bar" style="background:${st.color}"></span>
      <div class="info">
        <div class="nm">${esc(st.name)}</div>
        <div class="meta">店長: ${esc(mg?mg.name:"-")}｜${st.mode==="pattern"?"パターン制":"自由時間制"}</div>
        <div class="meta">来月シフト: ${status}　希望提出: ${reqN}件</div>
        <div class="meta">${over.length
          ? `<span class="fw-chip">⚠ 扶養超過見込み ${over.length}名</span> <span class="small">${esc(over.map(u=>u.name).join("・"))}</span>`
          : `扶養: 超過見込みなし`}</div>
      </div>
      <span class="arrow">›</span>
    </div>`;
  }).join("");
  // 無効化した店舗も過去実績の閲覧のためドリルインできる(本体の一覧からは外し、下に薄く並べる)
  const arch = state.stores.filter(st => st.archived);
  const archArea = arch.length ? `<div class="ms-grp">無効化した店舗</div>` + arch.map(st =>
    `<div class="card own-card ms-off" onclick="A.ownerOpen(${st.id})">
      <span class="bar" style="background:${st.color}"></span>
      <div class="info"><div class="nm">${esc(st.name)} <span class="st-chip st-none">無効化済み</span></div>
        <div class="meta">過去のシフト・希望は残っています（タップで閲覧できます）</div></div>
      <span class="arrow">›</span>
    </div>`).join("") : "";
  return `<div class="mgr-toolbar">
    <h2 class="sec" style="font-size:17px; margin:0;">全店舗ダッシュボード（${ny}年${nm+1}月）</h2>
    <span style="flex:1"></span>
    ${vcan("master") ? `<button class="btn btn-sm" onclick="A.openMaster()">🏬 マスタ管理</button>` : ""}
    ${vcan("wage") ? `<button class="btn btn-sm" onclick="A.openStaffSettings()">👤 個人設定</button>` : ""}
    ${vcan("master") ? `<button class="btn btn-sm" onclick="A.openCommonSettings()">⚙ 共通設定</button>` : ""}
  </div>${cards}${archArea}
  <p class="small muted">店舗カードをタップすると、その店舗のシフト表（店長画面と同等）を開きます。</p>
  <p class="small muted">「マスタ管理」では店舗・スタッフの追加／編集／無効化と、ロール（権限の段）の管理ができます。</p>
  <p class="small muted">「共通設定」では雇用形態ごとの既定実働時間・休憩の自動ルール・全店共通のシフトパターン・扶養の上限額を設定できます。「個人設定」ではスタッフごとの時給・扶養区分などを設定できます。</p>`;
}

  ${cards}`;
}

/* ---------------- マスタ管理(店舗・スタッフ・ロール) ----------------
   クライアント自身が運用できるようにするための画面。
   編集はモーダル単位で「保存する」→即 state 反映(共通設定のようなドラフト方式にはしない)。
   動的な文字列(名前など)はJS引数に埋め込まず、必ずIDで受け渡す
   ------------------------------------------------------------------- */
function masterHtml(){
  /* ----- ① 店舗 ----- */
  // 無効化済みは末尾に薄表示で並べる(物理削除はしないため一覧からは消さない)
  const stRows = state.stores.slice()
    .sort((a,b) => (a.archived ? 1 : 0) - (b.archived ? 1 : 0))
    .map(st => {
      const n = state.users.filter(u => u.storeId === st.id && !retired(u)).length;
      return `<div class="pat-row${st.archived ? " ms-off" : ""}">
        <span class="pc" style="background:${st.color}"></span>
        <div class="pi">
          <b>${esc(st.name)}</b>${st.archived ? ` <span class="st-chip st-none">無効化済み</span>` : ""}
          <small>${st.mode === "pattern" ? "パターン制" : "自由時間制"}・在籍スタッフ ${n}名</small>
        </div>
        <button class="btn btn-sm" onclick="A.openStoreEdit(${st.id})">編集</button>
      </div>`;
    }).join("");

  /* ----- ② スタッフ ----- */
  const uRow = u => `<div class="us-row${retired(u) ? " ms-off" : ""}" onclick="A.openStaffEdit(${u.id})">
    <div class="ui2">
      <b>${esc(u.name)}</b>${retired(u) ? ` <span class="st-chip st-none">退職済み ${esc(u.leaveDate)}</span>` : ""}
      <small>${esc(roleOf(u).name)}・${esc(u.type)}</small>
      ${(u.joinDate || u.leaveDate) ? `<small>${u.joinDate ? `入社 ${esc(u.joinDate)}` : ""}${(u.joinDate && u.leaveDate) ? "／" : ""}${u.leaveDate ? `退職 ${esc(u.leaveDate)}` : ""}</small>` : ""}
    </div>
    <span class="arrow">›</span></div>`;
  const noStore = state.users.filter(u => !u.storeId);
  const uGroups = (noStore.length ? `<div class="ms-grp">店舗に所属しない</div>${noStore.map(uRow).join("")}` : "")
    + activeStores().map(st => {
      const list = state.users.filter(u => u.storeId === st.id);
      return `<div class="ms-grp"><span class="store-dot" style="display:inline-block;background:${st.color}"></span> ${esc(st.name)}</div>`
        + (list.length ? list.map(uRow).join("") : `<p class="small muted">スタッフがいません。</p>`);
    }).join("")
    // 無効化した店舗に残っているスタッフも末尾に薄表示で出す。
    // 出さないと一覧から消えてしまい、復職・別店舗への異動ができない片道になる
    + state.stores.filter(s => s.archived).map(st => {
      const list = state.users.filter(u => u.storeId === st.id);
      if(!list.length) return "";
      return `<div class="ms-grp ms-off"><span class="store-dot" style="display:inline-block;background:${st.color}"></span> ${esc(st.name)}（無効化済み）</div>`
        + list.map(uRow).join("");
    }).join("");

  /* ----- ③ ロール(段) ----- */
  let lvRows = "";
  for(let lv = MAX_LEVEL; lv >= 1; lv--){
    const rs = state.roles.filter(r => r.level === lv);
    const items = rs.length ? rs.map(r => {
      const n = state.users.filter(u => u.role === r.id).length;
      // 既定ロールのidは文字列・追加ロールは数値。onclick属性は " で囲むのでJS側は ' で括る
      const rid = typeof r.id === "number" ? String(r.id) : `'${r.id}'`;
      return `<div class="pat-row">
        <div class="pi"><b>${esc(r.name)}</b><small>${n}名に設定${isFixedRole(r.id) ? "・既定のロール" : ""}</small></div>
        <button class="btn btn-sm" onclick="A.openRoleEdit(${rid})">編集</button>
        ${isFixedRole(r.id) ? "" : `<button class="btn btn-sm btn-danger" onclick="A.delRole(${rid})">✕</button>`}
      </div>`;
    }).join("") : `<p class="small muted" style="margin:0;">このロールはまだありません（ここに段を挿せます）。</p>`;
    lvRows += `<div class="ms-lv">
      <div class="lv-h">Lv${lv}</div>
      <div class="lv-c">${LEVEL_CAPS[lv]}</div>
      ${items}
    </div>`;
  }

  return `<div class="mgr-toolbar">
    <button class="btn btn-sm" onclick="A.ownerBack()">‹ ダッシュボード</button>
    <span style="font-weight:700;">マスタ管理</span>
  </div>
  <div class="card">
    <h2 class="sec">店舗</h2>
    <p class="small muted" style="margin:0 0 8px;">店舗は削除ではなく<b>無効化</b>します（過去のシフト・希望・設定は残り、あとから再開できます）。方式（パターン制／自由時間制）は追加時のみ指定できます。</p>
    ${stRows}
    <div style="margin-top:10px;"><button class="btn btn-sm" onclick="A.openStoreEdit(null)">＋ 店舗を追加</button></div>
  </div>
  <div class="card">
    <h2 class="sec">スタッフ</h2>
    <p class="small muted" style="margin:0 0 8px;">ここでは<b>氏名・所属店舗・ロール・入社日・退職日</b>を管理します（時給・勤務条件は「個人設定」）。退職したスタッフは<b>削除せず退職日</b>を入れます（過去のシフト実績は残ります）。</p>
    ${uGroups}
    <div style="margin-top:10px;"><button class="btn btn-sm" onclick="A.openStaffEdit(null)">＋ スタッフを追加</button></div>
  </div>
  <div class="card">
    <h2 class="sec">ロール（権限の段）</h2>
    <p class="small muted" style="margin:0 0 8px;"><b>上の段は下の段の権限をすべて含みます</b>。「副店長（店長とスタッフの間）」のように<b>段を挿す</b>形でロールを追加できます（入力は名前と段の2つだけ）。既定の3ロールは名前だけ変更できます。</p>
    ${lvRows}
    <div><button class="btn btn-sm" onclick="A.openRoleEdit(null)">＋ ロールを追加</button></div>
  </div>`;
}

/* ---------------- 共通設定(オーナーのみ・全店舗に効く) ---------------- */
function commonSettingsHtml(){
  const d = ui.setDraft;

  // (1) 雇用形態ごとの既定「実働」時間。自動生成の初期値になる(店長はセルで個別に変更可)
  //     休憩は持たせない(2層のルール: パターンの設定 → 無ければ段階制ルール)
  const empKeys = Object.keys(d.employmentDefaults);
  const empRows = empKeys.map((t, i) => {
    const e = d.employmentDefaults[t];
    const span = spanForWorkTiers(d.breakTiers, e.workMin);
    return `<div class="frow emp-row">
      <label>${esc(t)}</label>
      <span class="unit">実働 <input type="number" min="0.5" max="${MAX_WORK_MIN/60}" step="0.5" value="${e.workMin/60}" onchange="A.empField(${i},'work',this.value)"> 時間</span>
      <span class="small muted">＋ 休憩${breakByTiers(d.breakTiers, span)}分（自動）＝ 拘束 ${hmLabel(span)}</span>
    </div>`;
  }).join("");

  // (2) 休憩の段階制ルール(拘束時間 → 休憩)。法令の数字はハードコードせずここで変更できる
  const tierRows = d.breakTiers.map((t, i) => {
    const isLast = t.spanMaxMin == null;
    const cond = isLast
      ? `<span class="unit">それを超える</span>`
      : `<span class="unit">拘束 <input type="number" min="0" max="24" step="1" value="${Math.floor(t.spanMaxMin/60)}"
            onchange="A.tierField(${i},'h',this.value)"> 時間
          <input type="number" min="0" max="59" step="5" value="${t.spanMaxMin%60}"
            onchange="A.tierField(${i},'m',this.value)"> 分 以下</span>`;
    return `<div class="frow emp-row">${cond}
      <span class="unit">→ 休憩 <input type="number" min="0" max="240" step="5" value="${t.breakMin}"
        onchange="A.tierField(${i},'break',this.value)"> 分</span>
    </div>`;
  }).join("");

  // (3) シフトパターン(全店共通の1セット)
  const patRows = d.patterns.length ? d.patterns.map(p => {
    const span = tm(p.end) - tm(p.start);
    const br = patBreakMin(p, d.breakTiers);
    const used = d.stores.filter(s => (s.patternIds||[]).includes(p.id)).map(s => s.name);
    return `<div class="pat-row">
      <span class="pc" style="background:${p.color}"></span>
      <div class="pi">
        <b>${esc(p.name)}</b>
        <small>${p.start}〜${p.end}（${p.breakMin != null ? `休憩${br}分・手動` : `休憩${br}分・自動`}・実働${hmLabel(Math.max(0, span - br))}）</small>
        <small>使用店舗: ${used.length ? esc(used.join("・")) : "なし"}</small>
      </div>
      <button class="btn btn-sm" onclick="A.editPattern(${p.id})">編集</button>
      <button class="btn btn-sm btn-danger" onclick="A.askDelPattern(${p.id})">✕</button>
    </div>`;
  }).join("") : `<p class="small muted">パターンがありません。「＋ パターンを追加」で登録してください。</p>`;

  // (4) 店舗ごとに使うパターンを選ぶ(パターン制はもちろん自由時間制の店舗でも使える)
  const storeRows = d.stores.map(st => {
    const chks = d.patterns.map(p => `<label class="chk">
      <input type="checkbox" ${(st.patternIds||[]).includes(p.id) ? "checked" : ""}
        onchange="A.storePat(${st.id},${p.id},this.checked)">
      <span class="store-dot" style="background:${p.color}"></span>${esc(p.name)} ${p.start}〜${p.end}</label>`).join("");
    return `<div class="set-store">
      <div class="sn"><span class="store-dot" style="display:inline-block;background:${st.color}"></span> ${esc(st.name)}
        <span class="small muted">${st.mode === "pattern" ? "パターン制" : "自由時間制（手動あてはめ用）"}</span></div>
      <div class="chk-grid">${chks || `<span class="small muted">選べるパターンがありません</span>`}</div>
    </div>`;
  }).join("");

  return `<div class="mgr-toolbar">
    <button class="btn btn-sm" onclick="A.ownerBack()">‹ ダッシュボード</button>
    <span style="font-weight:700;">共通設定（全店舗）</span>
  </div>
  <div class="card">
    <h2 class="sec">雇用形態ごとの既定実働時間</h2>
    <p class="small muted" style="margin:0 0 8px;">自動生成のときの1コマの長さに使います（自由時間制の店舗の自動生成に使います。パターン制の店舗はパターンの時刻が優先されます）。休憩は下の「休憩の自動ルール」で決まるので、ここでは実働だけを設定します。店長は各セルを開いて個別の時刻に変更できます。<br>下の「拘束」はこの設定どおりの目安です。<b>実際の時刻は店舗の営業時間に合わせて調整されることがあります</b>（例: 閉店まで30分未満しか残らないときは閉店に合わせます）。</p>
    ${empRows}
  </div>
  <div class="card">
    <h2 class="sec">休憩の自動ルール（段階制）</h2>
    <p class="small muted" style="margin:0 0 8px;">休憩は<b>2段階</b>で決まります。①パターンに休憩が設定されていればそれを使う　②設定が無ければ下のルールで自動的に決まる。<br>
      初期値は労働基準法（実働6時間超で45分・8時間超で60分）を拘束時間に置き換えたものです。<b>法改正に合わせてここで変更できます。</b></p>
    ${tierRows}
  </div>
  <div class="card">
    <h2 class="sec">シフトパターン（全店共通）</h2>
    <p class="small muted" style="margin:0 0 4px;">ここで1セット登録し、下の「店舗ごとの使用パターン」で店舗ごとに選びます。休憩は「自動（ルールで決める）」と「手動◯分」を選べます。</p>
    ${patRows}
    <div style="margin-top:10px;"><button class="btn btn-sm" onclick="A.editPattern(null)">＋ パターンを追加</button></div>
  </div>
  <div class="card">
    <h2 class="sec">店舗ごとの使用パターン</h2>
    <p class="small muted" style="margin:0 0 8px;"><b>自由時間制の店舗では手動あてはめ用</b>です（自動生成には使われず、店長がセルにあてはめて微調整するときと、スタッフのパターン希望で使えます）。</p>
    ${storeRows}
  </div>
  <div class="card">
    <h2 class="sec">扶養の上限額（年間）</h2>
    <p class="small muted" style="margin:0 0 8px;">扶養内のスタッフの「累計＋今月の見込み」がこの金額を超えると警告が出ます。<b>基準額は改正が続いているため、固定値ではなく設定値にしています。</b></p>
    <div class="frow"><label>年間の上限額</label>
      <input type="number" min="0" max="99999999" step="10000" style="width:130px;"
        value="${d.fuyouLimit}" onchange="A.fuyouLimitField(this.value)"> 円</div>
  </div>
  <div style="display:flex; gap:8px; margin-bottom:20px;">
    <button class="btn btn-primary" onclick="A.saveCommonSettings()">保存する</button>
    <button class="btn" onclick="A.ownerBack()">キャンセル</button>
  </div>`;
}

/* =====================================================================
   モーダル / トースト
   ===================================================================== */
function openModal(html){
  closeModal();
  const ovl = document.createElement("div");
  ovl.className = "ovl"; ovl.id = "ovl";
  ovl.innerHTML = `<div class="mdl" onclick="event.stopPropagation()">${html}</div>`;
  ovl.addEventListener("click", closeModal);
  document.body.appendChild(ovl);
}
function closeModal(){ const o = document.getElementById("ovl"); if(o) o.remove(); }
function mdlHead(t){ return `<div class="mdl-head"><span class="t">${t}</span><button class="x" onclick="A.closeModal()">✕</button></div>`; }

let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* =====================================================================
   アクション
   ===================================================================== */
const A = {
  closeModal,

  /* ----- 視点 ----- */
  // view は「誰の視点か」だけ。どの画面になるかはその人のロールの段で決まる
  setView(userId){
    view = { userId };
    ui.staffTab = "shift"; ui.staffCalOffset = 0; ui.staffShiftView = "mine";
    ui.mgrMonthOffset = 1; ui.mgrScreen = "grid"; ui.ownerStore = null;
    ui.ownerScreen = "dash"; ui.setDraft = null; ui.condDraft = null;
    saveView(); render();
  },
  gotoSelect(){ view = null; saveView(); render(); },
  noManager(){ toast("この店舗の店長は未設定です（マスタ管理で設定できます）"); },

  /* ----- スタッフ ----- */
  staffTab(t){ ui.staffTab = t; render(); },
  // 「自分のシフト / 店舗全体」の切替。保存はしない(リロードで自分のシフトに戻る)
  staffShiftView(v){ ui.staffShiftView = v; render(); },
  staffCal(d){ ui.staffCalOffset += d; render(); },
  staffDay(ds){
    const me = userOf(view.userId);
    const st = storeOf(me.storeId);
    const shs = state.shifts.filter(s => s.storeId === st.id && s.date === ds && s.status === "published")
      .sort((a,b) => tm(a.start) - tm(b.start) || a.userId - b.userId);
    const rows = shs.length ? shs.map(s => {
      const u = userOf(s.userId);
      const p = s.patternId ? patternOf(s.patternId) : null;
      return `<div class="roster"><span class="store-dot" style="background:${p?p.color:st.color}"></span>
        <b>${esc(u.name)}</b><span class="muted small">${esc(u.type)}</span>
        <span style="flex:1"></span><span>${p&&p.start===s.start&&p.end===s.end?esc(p.name)+"　":""}${s.start}〜${s.end}</span></div>`;
    }).join("") : `<p class="small muted">この日の公開済みシフトはありません。</p>`;
    openModal(`${mdlHead(jdate(ds) + " の体制（" + esc(st.name) + "）")}${rows}`);
  },
  readNtf(id){
    const n = state.notifications.find(x => x.id === id);
    if(n && !n.read){ n.read = true; saveState(); render(); }
  },

  /* ----- 希望提出 ----- */
  openReq(ds){
    const me = userOf(view.userId);
    // 在籍期間外(入社前・退職後)の日には希望を出せない
    if(!activeOn(me, ds)){ toast("在籍期間外の日には希望を出せません（入社前または退職後の日です）"); return; }
    const st = storeOf(me.storeId);
    const cur = reqAt(me.id, ds);
    const curArea = cur ? `<p class="small" style="background:var(--accent-soft); border-radius:8px; padding:8px 10px;">
        提出済み: <b>${reqLabel(cur)}</b>
        <button class="btn btn-sm btn-danger" onclick="A.dropReq('${ds}')">取り下げる</button></p>` : "";
    const offN = dayOffCount(me.id, ymOf(ds));
    const guide = `<p class="small muted" style="margin:0 0 6px;">
      希望休 ${offN} / ${MAX_DAY_OFF}日（有給は上限に含みません）</p>`;
    let opts = `<button class="btn btn-lg" onclick="A.submitReq('${ds}','day_off')">😴 希望休</button>
      <button class="btn btn-lg" onclick="A.submitReq('${ds}','paid_leave')">🏖 有給申請</button>`;
    // 店舗にパターンがあれば、自由時間制の店舗でもパターンで希望を出せる
    opts += storePatterns(st.id).map(p =>
      `<button class="btn btn-lg" onclick="A.submitReq('${ds}','pattern',${p.id})">${esc(p.name)}を希望（${p.start}〜${p.end}）</button>`).join("");
    if(st.mode === "pattern"){
      opts += `<button class="btn btn-lg" onclick="A.submitReq('${ds}','any')">どちらでも</button>`;
    }else{
      opts += `<button class="btn btn-lg" onclick="A.submitReq('${ds}','any')">終日可</button>
      <div class="frow" style="margin-top:4px;"><label style="min-width:0;">時間指定</label>
        ${timeSel("", "10:00").replace("<select", '<select id="rq-start"')} 〜 ${timeSel("", "15:00").replace("<select", '<select id="rq-end"')}
      </div>
      <button class="btn btn-lg btn-primary" onclick="A.submitReqTime('${ds}')">この時間で提出</button>`;
    }
    openModal(`${mdlHead(jdate(ds) + " の希望")}${curArea}${guide}<div class="opt-grid">${opts}</div>`);
  },
  submitReq(ds, type, patternId){
    this._putReq(ds, { type, patternId: patternId || null, start:null, end:null });
  },
  submitReqTime(ds){
    const s = document.getElementById("rq-start").value;
    const e = document.getElementById("rq-end").value;
    if(tm(e) <= tm(s)){ toast("終了時刻は開始時刻より後にしてください"); return; }
    this._putReq(ds, { type:"time", start:s, end:e, patternId:null });
  },
  _putReq(ds, data){
    const me = userOf(view.userId);
    if(!activeOn(me, ds)){ toast("在籍期間外の日には希望を出せません（入社前または退職後の日です）"); return; }
    // 希望休は月MAX_DAY_OFF日まで(有給は別枠でカウントしない)。
    // 同じ日の出し直しは差し替えなので、その日ぶんは残数から除いて数える
    if(data.type === "day_off"){
      const used = state.requests.filter(r =>
        r.userId === me.id && r.type === "day_off" && ymOf(r.date) === ymOf(ds) && r.date !== ds).length;
      if(used >= MAX_DAY_OFF){
        toast(`希望休は月${MAX_DAY_OFF}日までです（すでに${used}日提出済み・有給は別枠）`);
        return;
      }
    }
    state.requests = state.requests.filter(r => !(r.userId === me.id && r.date === ds));
    state.requests.push({
      id: state.seq++, storeId: me.storeId, userId: me.id, date: ds,
      type: data.type, start: data.start, end: data.end, patternId: data.patternId,
      status: "submitted", createdAt: new Date().toISOString()
    });
    saveState(); closeModal(); render();
    toast(data.type === "paid_leave" ? "有給を申請しました（店長に送信）" : "店長に送信されました");
  },
  dropReq(ds){
    const me = userOf(view.userId);
    state.requests = state.requests.filter(r => !(r.userId === me.id && r.date === ds));
    saveState(); closeModal(); render();
    toast("希望を取り下げました");
  },

  /* ----- 店長 ----- */
  mgrMonth(o){ ui.mgrMonthOffset = o; render(); },
  mgrGrid(){ ui.mgrScreen = "grid"; ui.condDraft = null; render(); },
  mgrConditions(storeId){
    ui.mgrScreen = "conditions";
    ui.condDraft = JSON.parse(JSON.stringify(state.conditions[storeId] || {}));
    render();
  },
  condField(key, val){ ui.condDraft[key] = val === "" ? null : Number(val); },
  condRatio(patternId, val){
    ui.condDraft.patternRatio = ui.condDraft.patternRatio || {};
    ui.condDraft.patternRatio[patternId] = val === "" ? 0 : Number(val);
    render();   // 「実効◯%」を入力に追従させる
  },
  bandField(i, key, val){
    const b = ui.condDraft.hourlyHeadcount[i];
    if(key === "count") b.count = Number(val); else b[key] = val;
  },
  bandAdd(){
    ui.condDraft.hourlyHeadcount = ui.condDraft.hourlyHeadcount || [];
    ui.condDraft.hourlyHeadcount.push({ from:"10:00", to:"13:00", count:1 });
    render();
  },
  bandDel(i){ ui.condDraft.hourlyHeadcount.splice(i, 1); render(); },
  // 月別の公休日数(上書き)。ドラフト(ui.condDraft)に持ち、保存は saveConditions が丸ごと行う。
  // 設定できるのは来月以降だけ
  monthOffField(ym, val){
    ui.condDraft.monthly = ui.condDraft.monthly || {};
    ui.condDraft.monthly[ym] = ui.condDraft.monthly[ym] || {};
    ui.condDraft.monthly[ym].monthlyDaysOff = val === "" ? null : Number(val);
  },
  monthOffAdd(){
    const el = document.getElementById("cd-movr-add");
    const ym = el ? el.value : "";
    if(!ym){ toast("追加できる月がありません"); return; }
    const [ny1, nm1] = monthAt(1);
    if(ym < ymKey(ny1, nm1)){ toast("公休日数を変更できるのは来月以降だけです"); return; }
    ui.condDraft.monthly = ui.condDraft.monthly || {};
    ui.condDraft.monthly[ym] = ui.condDraft.monthly[ym] || {};
    if(ui.condDraft.monthly[ym].monthlyDaysOff == null)
      ui.condDraft.monthly[ym].monthlyDaysOff =
        ui.condDraft.monthlyDaysOff != null ? ui.condDraft.monthlyDaysOff : 8;
    render();
  },
  monthOffDel(ym){
    const [ny1, nm1] = monthAt(1);
    if(ym < ymKey(ny1, nm1)){ toast("公休日数を変更できるのは来月以降だけです"); return; }
    const mo = ui.condDraft.monthly;
    if(mo && mo[ym]){
      delete mo[ym].monthlyDaysOff;
      if(!Object.keys(mo[ym]).length) delete mo[ym];
    }
    render();
  },
  saveConditions(storeId){
    const bands = ui.condDraft.hourlyHeadcount || [];
    if(bands.some(b => tm(b.from) >= tm(b.to))){
      toast("時間帯の開始は終了より前にしてください"); return;
    }
    // 既定の「月の公休日数」: 空欄(null)は「設定なし」としてそのまま許す(月別の空欄＝上書き無しと同じ扱い)。
    // 値が入っているときは 0〜31 の整数のみ。既定値はどの月にも使われるため上限は月の最大日数(31)で見る
    // (月別の上書きはその月の日数 dim で見る)。負値を通すと目標勤務日数が月の日数を超え、消せない警告帯になる
    const bd = ui.condDraft.monthlyDaysOff;
    if(bd != null && (!isFinite(bd) || bd < 0 || bd > 31 || bd !== Math.floor(bd))){
      toast("月の公休日数は0〜31の整数で入力してください"); return;
    }
    // 月別の上書き: 空欄にされた行は保存せず捨てる。値は 0〜その月の日数 の整数のみ
    const mo = ui.condDraft.monthly || {};
    for(const k of Object.keys(mo)){
      const v = mo[k] ? mo[k].monthlyDaysOff : null;
      if(v == null || v === ""){
        delete mo[k].monthlyDaysOff;
        if(!Object.keys(mo[k]).length) delete mo[k];
        continue;
      }
      const ay = Number(k.slice(0,4)), am = Number(k.slice(5,7)) - 1;
      const nd = dim(ay, am);
      if(!isFinite(v) || v < 0 || v > nd || v !== Math.floor(v)){
        toast(`${ay}年${am+1}月の公休日数は0〜${nd}の整数で入力してください`); return;
      }
    }
    if(!Object.keys(mo).length) delete ui.condDraft.monthly;
    state.conditions[storeId] = JSON.parse(JSON.stringify(ui.condDraft));
    saveState();
    ui.mgrScreen = "grid"; ui.condDraft = null;
    render(); toast("条件を保存しました");
  },

  // その月だけの公休日数。条件設定のドラフト方式ではなく即時保存(マスタ管理と同じ)。
  // 設定できるのは来月以降だけ
  openMonthDaysOff(storeId){
    const [y, m] = monthAt(ui.mgrMonthOffset);
    const [ny1, nm1] = monthAt(1);
    if(ymKey(y, m) < ymKey(ny1, nm1)){ toast("公休日数を変更できるのは来月以降だけです"); return; }
    const c    = state.conditions[storeId] || {};
    const base = c.monthlyDaysOff;
    const cur  = monthlyDaysOffIn(state, storeId, y, m);
    const ovr  = hasMonthlyOverride(state, storeId, y, m, "monthlyDaysOff");
    const baseLabel = base == null ? "未設定" : base + "日";
    openModal(`${mdlHead(`${y}年${m+1}月の公休日数`)}
      <p class="small muted">この月だけの公休日数を設定します。ほかの月は「⚙ 条件設定」の
      <b>月の公休日数</b>（既定 ${baseLabel}）が使われます。<br>
      変更しても自動的に作り直しはしません。<b>「✨ 自動生成」を押し直す</b>と反映されます。</p>
      <div class="frow"><label>この月の公休日数</label>
        <input type="number" id="md-off" min="0" max="${dim(y, m)}" value="${cur == null ? "" : cur}"> 日</div>
      <button class="btn btn-lg btn-primary" onclick="A.saveMonthDaysOff(${storeId})">この月だけ保存する</button>
      ${ovr ? `<button class="btn btn-lg" style="margin-top:8px;" onclick="A.clearMonthDaysOff(${storeId})">既定（${baseLabel}）に戻す</button>` : ""}`);
  },
  saveMonthDaysOff(storeId){
    const [y, m] = monthAt(ui.mgrMonthOffset);
    const [ny1, nm1] = monthAt(1);
    const ym = ymKey(y, m);
    if(ym < ymKey(ny1, nm1)){ toast("公休日数を変更できるのは来月以降だけです"); return; }
    const raw = document.getElementById("md-off").value;
    const n   = Number(raw);
    const nd  = dim(y, m);
    if(raw === "" || !isFinite(n) || n < 0 || n > nd || n !== Math.floor(n)){
      toast(`公休日数は0〜${nd}の整数で入力してください`); return;
    }
    const c = state.conditions[storeId] || (state.conditions[storeId] = {});
    c.monthly = c.monthly || {};
    c.monthly[ym] = c.monthly[ym] || {};
    c.monthly[ym].monthlyDaysOff = n;
    saveState(); closeModal(); render();
    toast(`${m+1}月の公休日数を${n}日にしました（自動生成し直すと反映されます）`);
  },
  clearMonthDaysOff(storeId){
    const [y, m] = monthAt(ui.mgrMonthOffset);
    const [ny1, nm1] = monthAt(1);
    const ym = ymKey(y, m);
    // 出口側のガード(入口は openMonthDaysOff。既定に戻す操作でも当月・過去月は触らせない)
    if(ym < ymKey(ny1, nm1)){ toast("公休日数を変更できるのは来月以降だけです"); return; }
    const c  = state.conditions[storeId] || {};
    if(c.monthly && c.monthly[ym]){
      delete c.monthly[ym].monthlyDaysOff;
      if(!Object.keys(c.monthly[ym]).length) delete c.monthly[ym];
      if(!Object.keys(c.monthly).length) delete c.monthly;
    }
    saveState(); closeModal(); render();
    toast(`${m+1}月の公休日数を既定に戻しました`);
  },

  openCell(storeId, userId, ds){
    const st = storeOf(storeId);
    const u = userOf(userId);
    const sh = shiftAt(userId, ds);
    const rq = reqAt(userId, ds);
    const pats = storePatterns(storeId);
    const emp = empDefault(u);
    const info = [];
    if(sh){
      const p = sh.patternId ? patternOf(sh.patternId) : null;
      info.push(`現在: <b>${p ? esc(p.name) + "　" : ""}${sh.start}〜${sh.end}</b>${sh.status==="draft"?"（下書き）":"（公開済み）"}`);
      // 休憩は2層: パターンの設定 → 無ければ段階制ルール。どちらが効いたかが分かるように出す
      info.push(`休憩 ${breakMinOf(sh)}分（${p && p.breakMin != null ? "パターンの設定" : "休憩の自動ルール"}）・実働 ${hLabel(workMinOf(sh))}`);
    }else{
      const span = spanMinIn(state, u);
      info.push(`${esc(u.type)}の既定: 実働 ${hLabel(emp.workMin)}＋休憩 ${breakByRule(span)}分（自動）＝ 拘束 ${hmLabel(span)}`);
    }
    if(rq) info.push(`スタッフの希望: <b>${reqLabel(rq)}</b>`);
    // 扶養内のスタッフは、その月の見込み額と残額を店長がその場で確認できるようにする
    // (給与情報なので、時給・扶養の閲覧権限がある段のロールにだけ出す)
    if(vcan("wage") && fuyouTarget(u)){
      const f = fuyouOf(u, parseD(ds).getFullYear(), parseD(ds).getMonth());
      info.push(`扶養: 累計 ${yenLabel(f.acc)} ＋ 当月見込み ${yenLabel(f.est)} ＝ <b>${yenLabel(f.total)}</b>／上限 ${yenLabel(f.limit)}　`
        + (f.over ? `<b style="color:var(--danger)">${yenLabel(-f.rest)} 超過見込み</b>` : `残り ${yenLabel(f.rest)}`));
    }
    const infoArea = info.length ? `<p class="small" style="background:#f7f8fb; border-radius:8px; padding:8px 10px;">${info.join("<br>")}</p>` : "";

    // 在籍期間外(入社前・退職後)の日は割当てられない。
    // ただし矛盾データ(退職日を後から入れた等)を掃除できるよう、シフトが残っている日は削除だけ許す
    if(!activeOn(u, ds)){
      if(!sh){ toast(`${u.name}さんは${jdate(ds)}に在籍していません（入社前または退職後）`); return; }
      openModal(`${mdlHead(esc(u.name) + "｜" + jdate(ds))}${infoArea}
        <p class="small" style="color:var(--danger);">この日は<b>在籍期間外</b>です（入社前または退職後）。シフトの削除のみできます。</p>
        <button class="btn btn-lg btn-danger" onclick="A.delCell(${storeId},${userId},'${ds}')">シフトを削除（公休にする）</button>`);
      return;
    }

    let body = "";
    // 自由時間制の店舗でもパターンを使える(あてはめてから下の時刻指定で微調整できる)
    if(pats.length){
      body += `<div class="opt-grid">` + pats.map(p =>
        `<button class="btn btn-lg" style="border-left:5px solid ${p.color}" onclick="A.setCellPattern(${storeId},${userId},'${ds}',${p.id})">${esc(p.name)}（${p.start}〜${p.end}／${patBreakText(p)}）</button>`).join("") + `</div>`;
    }
    // 既定値: 既存シフト → 店舗のパターン(パターン制) → 10:00＋雇用形態の既定(拘束)
    const usePat = st.mode === "pattern" && pats.length;
    const defS = sh ? sh.start : (usePat ? pats[0].start : "10:00");
    // timeSelは30分刻み。選択肢に無い時刻(例: 拘束8時間45分の18:45)を既定にすると
    // セレクトが先頭の06:00を表示してしまい保存できないので、30分単位に切り上げる
    const snap30 = x => Math.min(1440, Math.ceil(x / 30) * 30);
    const defE = sh ? sh.end : (usePat ? pats[0].end : mt(snap30(tm("10:00") + spanMinIn(state, u))));
    body += `<div class="frow" style="margin-top:6px;"><label style="min-width:0;">時刻指定</label>
      ${timeSel("", defS).replace("<select", '<select id="sh-start"')} 〜 ${timeSel("", defE).replace("<select", '<select id="sh-end"')}
    </div>
    <button class="btn btn-lg btn-primary" onclick="A.setCellTime(${storeId},${userId},'${ds}')">この時刻で保存</button>`;
    // 有給はスタッフ申請と同じデータ(requestsのpaid_leave)として登録する
    body += isLeave(rq)
      ? `<button class="btn btn-lg" style="margin-top:8px;" onclick="A.clearCellLeave(${storeId},${userId},'${ds}')">有給を取り消す</button>`
      : `<button class="btn btn-lg" style="margin-top:8px;" onclick="A.setCellLeave(${storeId},${userId},'${ds}')">🏖 有給にする</button>`;
    if(sh) body += `<button class="btn btn-lg btn-danger" style="margin-top:8px;" onclick="A.delCell(${storeId},${userId},'${ds}')">シフトを削除（公休にする）</button>`;

    openModal(`${mdlHead(esc(u.name) + "｜" + jdate(ds))}${infoArea}${body}`);
  },
  setCellPattern(storeId, userId, ds, patternId){
    const p = patternOf(patternId);
    this._saveShift(storeId, userId, ds, p.start, p.end, patternId);
  },
  setCellTime(storeId, userId, ds){
    const s = document.getElementById("sh-start").value;
    const e = document.getElementById("sh-end").value;
    if(tm(e) <= tm(s)){ toast("終了時刻は開始時刻より後にしてください"); return; }
    // パターン制でも時刻の個別調整可。既存がパターン由来なら維持しつつ時刻だけ変更
    const sh = shiftAt(userId, ds);
    this._saveShift(storeId, userId, ds, s, e, sh ? sh.patternId : null);
  },
  _saveShift(storeId, userId, ds, start, end, patternId){
    // 防御: 在籍期間外の日には割当てない(openCell 側でも塞いでいる)
    const u0 = userOf(userId);
    if(u0 && !activeOn(u0, ds)){
      toast(`${u0.name}さんは${jdate(ds)}に在籍していません（入社前または退職後）`); return;
    }
    let sh = shiftAt(userId, ds);
    const existed = !!sh;
    if(sh){ sh.start = start; sh.end = end; sh.patternId = patternId; }
    else{
      sh = { id: state.seq++, storeId, userId, date: ds, start, end, patternId, status:"draft" };
      state.shifts.push(sh);
    }
    let msg = "保存しました（下書き）";
    if(isPublishedMonth(storeId, ymOf(ds))){
      sh.status = "published";
      const stName = storeOf(storeId).name;
      notify(userId, "シフト変更のお知らせ",
        `${jdate(ds)}のシフトが${existed ? "変更" : "追加"}になりました（${start}〜${end}／${stName}）`);
      msg = "保存し、本人に差分通知を送りました";
    }
    saveState(); closeModal(); render(); toast(msg);
  },
  // 店長側の有給登録。スタッフの「有給申請」と同じ requests(paid_leave) に書く
  setCellLeave(storeId, userId, ds){
    const sh = shiftAt(userId, ds);
    if(sh) state.shifts = state.shifts.filter(s => s !== sh);
    state.requests = state.requests.filter(r => !(r.userId === userId && r.date === ds));
    state.requests.push({
      id: state.seq++, storeId, userId, date: ds, type:"paid_leave",
      start:null, end:null, patternId:null, status:"submitted", createdAt: new Date().toISOString()
    });
    let msg = "有給として登録しました";
    if(sh && sh.status === "published" && isPublishedMonth(storeId, ymOf(ds))){
      notify(userId, "シフト変更のお知らせ", `${jdate(ds)}が有給になりました（${storeOf(storeId).name}）`);
      msg = "有給として登録し、本人に差分通知を送りました";
    }
    saveState(); closeModal(); render(); toast(msg);
  },
  clearCellLeave(storeId, userId, ds){
    state.requests = state.requests.filter(r => !(r.userId === userId && r.date === ds && r.type === "paid_leave"));
    // 取り消し後の見え方は月の状態で変わる(作成済み=公休 / 未作成=まだ未定)
    const after = isMadeMonth(storeId, ymOf(ds)) ? "公休になります" : "この日はまだ未定に戻ります";
    let msg = `有給を取り消しました（${after}）`;
    // 登録時(setCellLeave)は通知するのに取消は無通知、では本人が予定を戻せない
    if(isPublishedMonth(storeId, ymOf(ds))){
      notify(userId, "シフト変更のお知らせ",
        `${jdate(ds)}の有給が取り消しになりました（${after}／${storeOf(storeId).name}）`);
      msg = "有給を取り消し、本人に差分通知を送りました";
    }
    saveState(); closeModal(); render(); toast(msg);
  },
  delCell(storeId, userId, ds){
    const sh = shiftAt(userId, ds);
    if(!sh) return;
    const wasPub = sh.status === "published";
    state.shifts = state.shifts.filter(s => s !== sh);
    let msg = "削除しました";
    if(wasPub && isPublishedMonth(storeId, ymOf(ds))){
      notify(userId, "シフト変更のお知らせ", `${jdate(ds)}のシフトが取り消しになりました（${storeOf(storeId).name}）`);
      msg = "削除し、本人に差分通知を送りました";
    }
    saveState(); closeModal(); render(); toast(msg);
  },

  generate(storeId){
    const [y, m] = monthAt(1); // 生成対象は来月
    const t0 = performance.now();
    const created = generateForMonth(state, storeId, y, m);
    const sec = (performance.now() - t0) / 1000;
    saveState(); render();
    const secLabel = sec < 0.05 ? "0.1秒未満" : `${sec.toFixed(1)}秒`;
    toast(`${created.length}件のシフトを作成しました（所要${secLabel}）`);
  },
  publish(storeId){
    const [y, m] = monthAt(1);
    const ym = ymKey(y, m);
    const drafts = state.shifts.filter(s => s.storeId === storeId && ymOf(s.date) === ym && s.status === "draft");
    if(!drafts.length){ toast("公開する下書きがありません"); return; }
    drafts.forEach(s => s.status = "published");
    state.publishedMonths[storeId + ":" + ym] = true;
    state.createdMonths[storeId + ":" + ym] = true;
    const st = storeOf(storeId);
    // 公開した月の在籍メンバーだけに通知する。
    // 退職者は membersFor には残る(実績シフトがあれば紙面・グリッドには出す)が、
    // 辞めた人に元の職場の公開通知が届くのは不自然なので通知先からは外す
    const mem = membersFor(storeId, y, m).filter(u => !retired(u));
    mem.forEach(u => notify(u.id, "シフト公開のお知らせ", `${st.name}の${m+1}月シフトが公開されました。アプリで確認してください。`));
    saveState(); render();
    toast(`${m+1}月のシフトを公開し、スタッフ${mem.length}名に通知しました`);

      box = `<div class="fuyou-box">

        <div>${f.over ? `<span class="ov">⚠ ${yenLabel(-f.rest)} 超過見込み</span>` : `残り ${yenLabel(f.rest)}`}</div>

      <div class="frow"><label>週の最大勤務日数</label>

        <span class="small muted">空欄＝制限なし</span></div>

      <div class="chk-grid" style="margin-bottom:10px;">${dowChks}</div>
      ${wageOk ? `<div class="frow"><label>時給</label>
        <input type="number" id="us-wage" min="0" max="100000" step="10" style="width:100px;" value="${u.wage ?? ""}" placeholder="空=なし"> 円</div>
      <div class="frow"><label>年初〜先月の累計額</label>
        <input type="number" id="us-ytd" min="0" max="99999999" step="1000" style="width:130px;" value="${u.ytdYen ?? 0}"> 円</div>
      <div class="frow"><label>扶養の区分</label>
        <select class="tsel" id="us-dep">
          <option value="in" ${dep?"selected":""}>扶養内（計算・警告の対象）</option>
          <option value="out" ${dep?"":"selected"}>扶養外（対象外）</option>
        </select></div>`
      : `<p class="small muted">時給・扶養の項目は、閲覧権限のあるロールのみ表示されます。</p>`}
      <p class="small muted" style="margin:0 0 10px;">休憩は個人ごとには設定しません（パターンの設定 → 無ければ休憩の自動ルール、の2段階で決まります）。</p>
      <button class="btn btn-lg btn-primary" onclick="A.saveUser(${userId})">保存する</button>`);
  },
  saveUser(userId){
    const u = userOf(userId); if(!u) return;
    const type = document.getElementById("us-type").value;
    const wk   = document.getElementById("us-week").value.trim();
    // 時給・扶養は権限が無いと画面に出ていない。その場合は既存値を一切変更しない
    const elWage = document.getElementById("us-wage");
    const elYtd  = document.getElementById("us-ytd");
    const elDep  = document.getElementById("us-dep");
    const wage = elWage ? elWage.value.trim() : null;
    const ytd  = elYtd ? elYtd.value.trim() : null;
    const dep  = elDep ? elDep.value === "in" : null;
    const days = DOWK.filter(k => { const el = document.getElementById("us-dow-" + k); return el && el.checked; });
    if(wk !== ""){
      const n = Number(wk);
      if(!isFinite(n) || n < 1 || n > 7){ toast("週の最大勤務日数は1〜7日で入力してください"); return; }
    }
    if(!days.length){ toast("出勤可能曜日を1つ以上選んでください"); return; }
    if(wage != null && wage !== ""){
      const n = Number(wage);
      if(!isFinite(n) || n < 0 || n > 100000){ toast("時給は0〜100,000円で入力してください"); return; }
    }
    let yn = null;
    if(ytd != null){
      yn = ytd === "" ? 0 : Number(ytd);
      if(!isFinite(yn) || yn < 0 || yn > 99999999){ toast("累計額は0〜99,999,999円で入力してください"); return; }
    }

    u.type = type;
    u.weeklyMaxDays = wk === "" ? null : Number(wk);
    u.availableDays = days.length === 7 ? null : days;   // 全曜日可なら制限なしとして持つ
    if(wage != null) u.wage = wage === "" ? null : Number(wage);
    if(yn != null) u.ytdYen = yn;
    if(dep != null) u.dependent = dep;
    saveState(); closeModal(); render();
    toast(`${u.name}さんの個人設定を保存しました`);
  },

  openStoreEdit(id){

      <p class="small muted" style="margin:0 0 10px;">パターン制の店舗は使用パターンを1つ以上選んでください（自由時間制は手動あてはめ用のため0個でも構いません）。</p>
      <button class="btn btn-lg btn-primary" onclick="A.saveStore(${st ? st.id : "null"})">保存する</button>
      ${archArea}`);
  },
  saveStore(id){
    const name = document.getElementById("ms-st-name").value.trim();
    if(!name){ toast("店舗名を入力してください"); return; }
    // 無効化済みの店舗とも重複させない(編集時は自分自身を除く)
    if(state.stores.some(s => s.name === name && s.id !== id)){ toast("同じ名前の店舗があります"); return; }
    const st = id != null ? storeOf(id) : null;
    const mode = st ? st.mode : document.getElementById("ms-st-mode").value;
    const color = document.getElementById("ms-st-color").value;
    const patternIds = state.patterns
      .filter(p => { const el = document.getElementById("ms-st-pat-" + p.id); return el && el.checked; })
      .map(p => p.id);
    if(mode === "pattern" && !patternIds.length){
      toast("パターン制の店舗は使用パターンを1つ以上選んでください"); return;
    }
    if(st){
      st.name = name; st.color = color; st.patternIds = patternIds;
    }else{
      const sid = state.seq++;
      state.stores.push({ id: sid, name, mode, color, patternIds });
      // 条件が無いと自動生成・不足判定が空条件で動いてしまうので必ず初期化する
      state.conditions[sid] = (mode === "pattern")
        ? { monthlyDaysOff: 8, maxConsecutive: 5, weekdayHeadcount: 2, weekendHeadcount: 3, patternRatio: {} }
        : { monthlyDaysOff: 8, maxConsecutive: 5, weekdayHeadcount: 2, weekendHeadcount: 3, hourlyHeadcount: [] };
    }
    saveState(); closeModal(); render();
    toast(st ? `${name}を保存しました` : `${name}を追加しました`);
  },

    const types = Object.keys((state.settings && state.settings.employmentDefaults) || {});

    // 所属なしにしてよいかの判断はガード5(降格禁止)に任せる
    const arcSt = u && u.storeId != null ? state.stores.find(s => s.id === u.storeId && s.archived) : null;
    const storeOpts = (u ? `<option value="" ${!u.storeId ? "selected" : ""}>（所属なし）</option>` : "")

      + (arcSt ? `<option value="${arcSt.id}" selected>${esc(arcSt.name)}（無効化済み）</option>` : "");
    const roleOpts = state.roles.slice().sort((a,b) => b.level - a.level).map(r => {

    }).join("");
    // 雇用形態は追加時のみ(編集は個人設定側の担当)。台帳系とのすみ分けを固定する
    const typeArea = u ? "" : `<div class="frow"><label>雇用形態</label>
      <select class="tsel" id="ms-u-type">${types.map(t =>
        `<option value="${esc(t)}" ${t === defType ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>`;
    openModal(`${mdlHead(u ? "スタッフを編集" : "スタッフを追加")}
      <div class="frow"><label>氏名</label>
        <input type="text" id="ms-u-name" value="${u ? esc(u.name) : ""}" placeholder="例: 山田 太郎" maxlength="20"></div>
      <div class="frow"><label>所属店舗</label><select class="tsel" id="ms-u-store">${storeOpts}</select></div>
      <div class="frow"><label>ロール</label><select class="tsel" id="ms-u-role">${roleOpts}</select></div>
      ${typeArea}
      <div class="frow"><label>入社日（稼働開始日）</label>
        <input type="date" id="ms-u-join" value="${u && u.joinDate ? u.joinDate : ""}"></div>
      <div class="frow"><label>退職日（最終在籍日）</label>
        <input type="date" id="ms-u-leave" value="${u && u.leaveDate ? u.leaveDate : ""}"></div>
      <p class="small muted" style="margin:0 0 10px;">入社日・退職日は<b>任意</b>です（空欄＝制限なし）。<b>退職日はその日まで勤務できます</b>。期間外の日は割当・希望提出ができません。<br>時給・勤務条件（週の上限・出勤可能曜日）は「個人設定」で編集します。</p>
      <button class="btn btn-lg btn-primary" onclick="A.saveStaff(${u ? u.id : "null"})">保存する</button>`);
  },
  saveStaff(id){
    const u = id != null ? userOf(id) : null;
    const name = document.getElementById("ms-u-name").value.trim();
    if(!name){ toast("氏名を入力してください"); return; }
    // select の値は文字列。storeId は数値で持つ(全域の === 比較が外れるため必ず変換する)
    const sv = document.getElementById("ms-u-store").value;
    const storeId = sv === "" ? undefined : Number(sv);
    // ロールのidは既定3ロール=文字列 / 追加ロール=数値。一致するidが無ければ数値として扱う
    const rv = document.getElementById("ms-u-role").value;
    const role = state.roles.some(r => r.id === rv) ? rv : Number(rv);
    const rObj = state.roles.find(r => r.id === role);
    if(!rObj){ toast("ロールを選んでください"); return; }
    const join  = document.getElementById("ms-u-join").value;
    const leave = document.getElementById("ms-u-leave").value;
    const elType = document.getElementById("ms-u-type");
    const type = elType ? elType.value : (u ? u.type : "社員");

    // 1. 退職日は入社日以降
    if(join && leave && leave < join){ toast("退職日は入社日以降にしてください"); return; }
    const willRetired = !!leave && leave < todayStr();
    // 2. 店長は1店舗1人(保存後の状態で判定する。所属店舗の変更だけでも重複が作れるため)
    //    保存対象者自身が退職者になる場合は判定しない。全参照が !retired で絞られていて実害が無く、
    //    ここで止めると「退職した元店長の氏名・退職日を直せない」行き止まりができる
    if(role === "manager" && storeId != null && !willRetired){
      const dup = state.users.find(x => x.id !== id && x.storeId === storeId && x.role === "manager" && !retired(x));
      if(dup){
        const st = storeOf(storeId);
        toast(`${st ? st.name : "この店舗"}の店長はすでに${dup.name}さんです（店長は1店舗1人）`); return;
      }
    }
    // 3. ロックアウト防止(マスタ管理ができる在籍ユーザーを0人にしない)
    const others = state.users.filter(x => x.id !== id && !retired(x) && can(x, "master")).length;
    const willMaster = rObj.level >= PERM_LEVELS.master && !willRetired;
    if(others + (willMaster ? 1 : 0) === 0){
      toast("マスタ管理ができる在籍ユーザーがいなくなるため、この変更はできません"); return;
    }
    // 5. 店舗に所属しないユーザーは、他店舗の閲覧を失う段のロールにできない
    //    (manager/staff の画面は所属店舗が前提のため、降格すると画面が開けなくなる)
    if(storeId == null && rObj.level < PERM_LEVELS.otherStores){
      toast("店舗に所属していないユーザーはこのロールにできません（先に所属店舗を設定してください）"); return;
    }
    // 6. 無効化した店舗に所属したまま在籍者に戻す保存は止める
    //    (視点選択もオーナーの個人設定一覧も activeStores() を走査するため、
    //     無効化店舗の在籍者はどちらにも出てこない=在籍者なのに存在しないように見える)
    const arcSt = (storeId != null && !willRetired)
      ? state.stores.find(s => s.id === storeId && s.archived) : null;
    if(arcSt){
      // どの店舗が無効化されているか名指しする(スタッフ一覧は複数店舗を同時に出すため)
      toast(`${arcSt.name}は無効化されています。先に所属店舗を変更してください`); return;
    }
    // 4. 在籍期間外のデータの後始末。入社日側・退職日側で対称に扱い、シフトと希望で扱いを分ける
    //    - 希望(requests): 「これから休みたい」という予定なので在籍期間外には意味を持たない。
    //      ここで削除する。残すとグリッドに全セル「—」の行が出続け、公開通知も飛ぶうえ、
    //      在籍期間外の日は希望モーダルが開かないので画面から消す手段が無い。
    //      ただし削除するのは「今日以降」の希望だけ。過去の希望まで消すと公開済みの有給が黙って消え、
    //      扶養の累計(monthEarnOf の有給分)も無通知で変わるため
    //    - シフト(shifts): 実績なので消さない。警告＋赤枠＋セルの削除専用モーダルで店長が判断して掃除する
    //    残シフトの警告は「今日以降」で絞らない(グリッドが赤枠を付ける範囲=在籍期間外の全日と件数を合わせる)
    let jrN = 0, lrN = 0, jshN = 0, shN = 0;
    if(id != null){
      const tds = todayStr();
      // 在籍期間外の希望を消して件数を返す(hit の範囲だけを消す)
      const purge = hit => {
        const n = state.requests.filter(hit).length;
        if(n) state.requests = state.requests.filter(r => !hit(r));
        return n;
      };
      if(join){
        jrN  = purge(r => r.userId === id && r.date >= tds && r.date < join);
        jshN = state.shifts.filter(s => s.userId === id && s.date < join).length;
      }
      if(leave){
        lrN = purge(r => r.userId === id && r.date > leave && r.date >= tds);
        shN = state.shifts.filter(s => s.userId === id && s.date > leave).length;
      }
    }
    // 文言は「入社日側の希望削除 → 退職日側の希望削除 → 残シフト」の順で「。」連結(末尾に「。」は付けない)。
    // 残シフトは必ず末尾の1文にまとめる(2文に分けると「シフト表から削除・整理してください」が2回出る)
    const parts = [];
    if(jrN) parts.push(`入社日より前の希望${jrN}件を削除しました`);
    if(lrN) parts.push(`退職日より後の希望${lrN}件を削除しました`);
    if(jshN && shN)
      parts.push(`入社日より前にシフト${jshN}件・退職日より後にシフト${shN}件が残っています。シフト表から削除・整理してください`);
    else if(jshN)
      parts.push(`入社日より前にシフト${jshN}件が残っています。シフト表から削除・整理してください`);
    else if(shN)
      // 直前が「退職日より後の希望◯件を削除しました」のときだけ主語が自明なので前置きを省く
      parts.push(lrN ? `シフト${shN}件が残っています。シフト表から削除・整理してください`
                     : `退職日より後にシフト${shN}件が残っています。シフト表から削除・整理してください`);
    const warn = parts.join("。");

    if(u){
      u.name = name; u.role = role;
      if(storeId == null) delete u.storeId; else u.storeId = storeId;
      if(join) u.joinDate = join; else delete u.joinDate;
      if(leave) u.leaveDate = leave; else delete u.leaveDate;
    }else{
      // wage は持たせない(=扶養計算の対象外)・dependent 未設定(既定ルールに従う)・
      // weeklyMaxDays / availableDays も持たせない(制限なし)。以降は個人設定で編集する
      const nu = { id: state.seq++, name, role, storeId, type, ytdYen: 0 };
      if(join) nu.joinDate = join;
      if(leave) nu.leaveDate = leave;
      state.users.push(nu);
    }
    saveState(); closeModal(); render();
    toast(warn || (u ? `${name}さんを保存しました` : `${name}さんを追加しました`));
  },

  /* ----- ③ ロール(段) ----- */
  openRoleEdit(id){
    const r = id != null ? state.roles.find(x => x.id === id) : null;
    const fixed = !!r && isFixedRole(r.id);
    const lv = r ? r.level : 2;
    let lvOpts = "";
    for(let i = MAX_LEVEL; i >= 1; i--)
      lvOpts += `<option value="${i}" ${i === lv ? "selected" : ""}>Lv${i}　${LEVEL_CAPS[i]}</option>`;
    const rid = r ? (typeof r.id === "number" ? String(r.id) : `'${r.id}'`) : "null";
    openModal(`${mdlHead(r ? "ロールを編集" : "ロールを追加")}
      <div class="frow"><label>名前</label>
        <input type="text" id="ms-r-name" value="${r ? esc(r.name) : ""}" placeholder="例: 副店長" maxlength="12"></div>
      <div class="frow"><label>段（権限の高さ）</label>
        <select class="tsel" id="ms-r-level" ${fixed ? "disabled" : ""}>${lvOpts}</select></div>
      ${fixed ? `<p class="small muted" style="margin:0 0 10px;">既定のロールは<b>名前だけ</b>変更できます（段の変更・削除はできません）。</p>`
        : `<p class="small muted" style="margin:0 0 10px;">上の段は下の段の権限をすべて含みます。</p>`}
      <button class="btn btn-lg btn-primary" onclick="A.saveRole(${rid})">保存する</button>`);
  },
  saveRole(id){
    const r = id != null ? state.roles.find(x => x.id === id) : null;
    const name = document.getElementById("ms-r-name").value.trim();
    if(!name){ toast("ロール名を入力してください"); return; }
    if(state.roles.some(x => x.name === name && x.id !== id)){ toast("同じ名前のロールがあります"); return; }
    const fixed = !!r && isFixedRole(r.id);
    const el = document.getElementById("ms-r-level");
    const level = (r && fixed) ? r.level : Math.min(MAX_LEVEL, Math.max(1, Number(el.value)));
    // 段を下げるとマスタ管理ができる人がいなくなることがある
    if(r && level !== r.level){
      const cnt = state.users.filter(u => {
        if(retired(u)) return false;
        const ur = roleOf(u);
        const l = ur.id === r.id ? level : ur.level;
        return l >= PERM_LEVELS.master;
      }).length;
      if(!cnt){ toast("マスタ管理ができる在籍ユーザーがいなくなるため、この変更はできません"); return; }
      // ガード5(店舗未所属ユーザーの降格禁止)は段の変更経由でも成立させる。
      // 店舗に所属しない人が他店舗の閲覧を失うと manager/staff 画面が開けず storeOf(undefined) で落ちる
      if(level < PERM_LEVELS.otherStores){
        const nos = state.users.find(u => u.role === r.id && u.storeId == null);
        if(nos){
          toast(`このロールには店舗に所属していないユーザー（${nos.name}さん）がいるため、この段には変更できません（先に所属店舗を設定してください）`); return;
        }
      }
    }
    if(r){ r.name = name; r.level = level; }
    else state.roles.push({ id: state.seq++, name, level });
    saveState(); closeModal(); render();
    toast(r ? `${name}を保存しました` : `${name}を追加しました`);
  },
  delRole(id){
    const r = state.roles.find(x => x.id === id); if(!r) return;
    if(isFixedRole(r.id)) return;
    const n = state.users.filter(u => u.role === r.id).length;   // 退職者も含めて数える
    if(n){ toast(`このロールは${n}名に設定されているため削除できません`); return; }
    state.roles = state.roles.filter(x => x.id !== id);
    saveState(); render(); toast(`${r.name}を削除しました`);
  },

  /* ----- 共通設定(全店舗) ----- */
  // 編集中は下書き(ui.setDraft)に溜め、「保存する」で初めて state に反映する
  openCommonSettings(){
    ui.ownerScreen = "settings";
    ui.setDraft = {
      employmentDefaults: JSON.parse(JSON.stringify(state.settings.employmentDefaults)),
      breakTiers: JSON.parse(JSON.stringify(breakTiersIn(state))),
      fuyouLimit: fuyouLimit(),
      patterns: JSON.parse(JSON.stringify(state.patterns)),
      // 無効化した店舗は編集対象に出さない(パターン0のガードも有効店舗だけが対象になる)
      stores: activeStores().map(s => ({ id:s.id, name:s.name, mode:s.mode, color:s.color, patternIds:(s.patternIds||[]).slice() }))
    };
    render();
  },
  // 雇用形態は名前でなくインデックスで受け取る(名前をJS文字列に埋め込まない)
  empField(idx, key, val){
    const t = Object.keys(ui.setDraft.employmentDefaults)[idx];
    const e = t != null ? ui.setDraft.employmentDefaults[t] : null; if(!e) return;
    const n = Number(val);
    if(!isFinite(n) || n <= 0){ toast("実働時間は0時間より大きい値を入力してください"); render(); return; }
    // 上限を超える値はグリッド・CSVに異常な時刻を出すのでここで止める
    if(n * 60 > MAX_WORK_MIN){ toast(`実働時間は${MAX_WORK_MIN/60}時間までです`); render(); return; }
    if(key === "work") e.workMin = Math.round(n * 60);
    render();
  },
  // 休憩の段階制ルール(拘束の閾値・休憩分)を編集する
  tierField(i, key, val){
    const t = ui.setDraft.breakTiers[i]; if(!t) return;
    const n = Number(val);
    if(!isFinite(n) || n < 0){ render(); return; }
    if(key === "break"){
      // 上限なしだと最終段(上限なしの段)に極端な値が入り、実働がマイナスのシフトができる
      if(n > MAX_BREAK_MIN){ toast(`休憩は${MAX_BREAK_MIN}分までです`); render(); return; }
      t.breakMin = Math.round(n);
    }
    else if(t.spanMaxMin != null){
      const h = key === "h" ? Math.round(n) : Math.floor(t.spanMaxMin / 60);
      const mm = key === "m" ? Math.round(n) : t.spanMaxMin % 60;
      t.spanMaxMin = Math.min(24*60, h * 60 + mm);
    }
    render();
  },
  fuyouLimitField(val){
    const n = Number(val);
    if(!isFinite(n) || n < 0){ render(); return; }
    ui.setDraft.fuyouLimit = Math.round(n);
  },
  storePat(storeId, patId, checked){
    const st = ui.setDraft.stores.find(s => s.id === storeId); if(!st) return;
    st.patternIds = st.patternIds.filter(id => id !== patId);
    // 表示順はパターン一覧の並びに合わせる
    if(checked) st.patternIds = ui.setDraft.patterns.filter(p => p.id === patId || st.patternIds.includes(p.id)).map(p => p.id);
    render();
  },
  editPattern(id){
    const d = ui.setDraft;
    const p = id != null ? d.patterns.find(x => x.id === id) : null;
    const cur = p || { name:"", start:"09:00", end:"17:00", breakMin:null, color:"#F2B441" };
    const auto = cur.breakMin == null;
    const autoMin = breakByTiers(d.breakTiers, tm(cur.end) - tm(cur.start));
    openModal(`${mdlHead(p ? "パターンを編集" : "パターンを追加")}
      <div class="frow"><label>名前</label>
        <input type="text" id="pt-name" value="${esc(cur.name)}" placeholder="例: A ／ 早番" maxlength="12"></div>
      <div class="frow"><label>時間（拘束）</label>
        ${timeSel("A.patBreakRefresh()", cur.start).replace("<select", '<select id="pt-start"')} 〜 ${timeSel("A.patBreakRefresh()", cur.end).replace("<select", '<select id="pt-end"')}</div>
      <div class="frow"><label>休憩</label>
        <select class="tsel" id="pt-break-mode" onchange="A.patBreakMode(this.value)">
          <option value="auto" ${auto?"selected":""}>自動（ルールで決める）</option>
          <option value="manual" ${auto?"":"selected"}>手動で指定</option>
        </select>
        <span id="pt-break-manual" style="${auto?"display:none;":""}">
          <input type="number" id="pt-break" min="0" max="240" step="5" value="${auto?autoMin:cur.breakMin}"> 分</span>
        <span id="pt-break-auto" class="small muted" style="${auto?"":"display:none;"}">この拘束時間なら ${autoMin}分（休憩の自動ルール）</span>
      </div>
      <div class="frow"><label>色</label><input type="color" id="pt-color" value="${cur.color}"></div>
      <p class="small muted" style="margin:0 0 10px;">「自動」は共通設定の<b>休憩の自動ルール（段階制）</b>で決まります。「手動」なら0分も明示的に指定できます。</p>
      <button class="btn btn-lg btn-primary" onclick="A.savePattern(${p ? p.id : "null"})">保存する</button>`);
  },
  // 休憩の 自動/手動 切替(モーダル内の表示だけ差し替える)
  patBreakMode(mode){
    const man = document.getElementById("pt-break-manual");
    const aut = document.getElementById("pt-break-auto");
    if(!man || !aut) return;
    if(mode === "auto"){
      const s = document.getElementById("pt-start").value, e = document.getElementById("pt-end").value;
      const n = tm(e) > tm(s) ? breakByTiers(ui.setDraft.breakTiers, tm(e) - tm(s)) : 0;
      aut.textContent = `この拘束時間なら ${n}分（休憩の自動ルール）`;
      man.style.display = "none"; aut.style.display = "";
    }else{
      man.style.display = ""; aut.style.display = "none";
    }
  },
  patBreakRefresh(){
    const sel = document.getElementById("pt-break-mode");
    if(sel) this.patBreakMode(sel.value);
  },
  savePattern(id){
    const d = ui.setDraft;
    const name = document.getElementById("pt-name").value.trim();
    const s = document.getElementById("pt-start").value;
    const e = document.getElementById("pt-end").value;
    const auto = document.getElementById("pt-break-mode").value === "auto";
    const br = auto ? null : Number(document.getElementById("pt-break").value);
    const color = document.getElementById("pt-color").value;
    if(!name){ toast("パターン名を入力してください"); return; }
    if(tm(e) <= tm(s)){ toast("終了時刻は開始時刻より後にしてください"); return; }
    if(!auto){
      if(!isFinite(br) || br < 0){ toast("休憩は0分以上で入力してください"); return; }
      if(br >= tm(e) - tm(s)){ toast("休憩が拘束時間以上です（実働が0になります）"); return; }
    }
    if(d.patterns.some(p => p.name === name && p.id !== id)){ toast("同じ名前のパターンがあります"); return; }
    if(id != null){
      const p = d.patterns.find(x => x.id === id);
      p.name = name; p.start = s; p.end = e; p.breakMin = auto ? null : br; p.color = color;
    }else{
      // 既存のシフト・希望が参照しているIDと衝突しないよう連番から採番する
      d.patterns.push({ id: state.seq++, name, start:s, end:e, breakMin: auto ? null : br, color });
    }
    // 手動休憩が自動ルールを下回る場合は保存は通すが警告する(明示の上書きなので止めはしない)
    const need = auto ? 0 : breakByTiers(d.breakTiers, tm(e) - tm(s));
    closeModal(); render();
    if(!auto && br < need)
      toast(`⚠ 休憩${br}分は自動ルール（この拘束時間なら${need}分）を下回ります。労働基準法の休憩を確認してください`);
  },
  askDelPattern(id){
    const p = ui.setDraft.patterns.find(x => x.id === id); if(!p) return;
    const shN  = state.shifts.filter(s => s.patternId === id).length;
    const pubN = state.shifts.filter(s => s.patternId === id && s.status === "published").length;
    const rqN  = state.requests.filter(r => r.type === "pattern" && r.patternId === id).length;
    const warn = (shN || rqN)
      ? `<p class="small">このパターンは<b>作成済みシフト${shN}件</b>（うち<b>公開済み ${pubN}件</b>）・<b>提出済みの希望${rqN}件</b>で使われています。<br>
         <b>公開済みのシフトも対象です。</b>削除しても時刻は残りますが、スタッフのカレンダーの表示が
         「${esc(p.name)}」から「${p.start}-${p.end}」（時刻のみ）に変わります（希望は時間指定に変わります）。<br>
         <b>この操作は元に戻せません。</b></p>`
      : `<p class="small">このパターンはまだ使われていません。<br><b>この操作は元に戻せません。</b></p>`;
    openModal(`${mdlHead("パターンを削除")}
      <p class="small"><b>${esc(p.name)}（${p.start}〜${p.end}）</b>を削除します。</p>${warn}
      <div class="opt-grid">
        <button class="btn btn-lg btn-danger" onclick="A.delPattern(${id})">削除する</button>
        <button class="btn btn-lg" onclick="A.closeModal()">キャンセル</button>
      </div>`);
  },
  delPattern(id){
    const d = ui.setDraft;
    d.patterns = d.patterns.filter(p => p.id !== id);
    d.stores.forEach(s => s.patternIds = s.patternIds.filter(pid => pid !== id));
    closeModal(); render();
  },
  saveCommonSettings(){
    const d = ui.setDraft;
    // 雇用形態の既定: 実働0時間は自動生成が破綻する。上限を超えると異常な時刻のシフトができる
    const badEmp = Object.keys(d.employmentDefaults).find(t => !(d.employmentDefaults[t].workMin > 0));
    if(badEmp){ toast(`${badEmp}の実働時間を0時間より大きくしてください`); return; }
    const overEmp = Object.keys(d.employmentDefaults).find(t => d.employmentDefaults[t].workMin > MAX_WORK_MIN);
    if(overEmp){ toast(`${overEmp}の実働時間は${MAX_WORK_MIN/60}時間までです`); return; }
    // 休憩の段階制ルール: 閾値は昇順・休憩は拘束より短いこと(実働が0以下にならない)
    const tiers = d.breakTiers;
    for(let i = 0; i < tiers.length; i++){
      const t = tiers[i];
      // 休憩分は全段で検証する(最終段=上限なしの段もここを通す。素通りすると実働がマイナスになる)
      if(!(t.breakMin >= 0) || t.breakMin > MAX_BREAK_MIN){
        toast(`休憩ルール${i+1}段目の休憩は0〜${MAX_BREAK_MIN}分で入力してください`); return;
      }
      if(t.spanMaxMin != null){
        if(!(t.spanMaxMin > 0)){ toast(`休憩ルール${i+1}段目の拘束時間を入力してください`); return; }
        const prev = i > 0 ? tiers[i-1].spanMaxMin : null;
        if(prev != null && t.spanMaxMin <= prev){ toast("休憩ルールの拘束時間は上から順に長くしてください"); return; }
        if(t.breakMin >= t.spanMaxMin){ toast(`休憩ルール${i+1}段目は休憩が拘束時間以上です`); return; }
      }
      // 短い段のほうが休憩が長いと、拘束から実働を逆算する側と休憩を決める側が食い違い、
      // 実働が既定より短い(0分に近い)コマができる。休憩は拘束が長い段ほど長くする
      if(i > 0 && t.breakMin < tiers[i-1].breakMin){
        toast("休憩ルールの休憩は、拘束が長い段ほど長く（または同じに）してください"); return;
      }
    }
    // 段階制ルールを変えると既存パターンの実働が0以下になることがある(自動休憩のパターン)
    const badPat = d.patterns.find(p => (tm(p.end) - tm(p.start)) - patBreakMin(p, tiers) <= 0);
    if(badPat){ toast(`パターン「${badPat.name}」は休憩が拘束時間以上になります（実働が0以下）`); return; }
    // パターン制の店舗はパターンが0だとシフトを組めない
    const badStore = d.stores.find(s => s.mode === "pattern" && !s.patternIds.length);
    if(badStore){ toast(`${badStore.name}（パターン制）は使用パターンを1つ以上選んでください`); return; }
    if(!(d.fuyouLimit > 0)){ toast("扶養の上限額を入力してください"); return; }

    const removed = state.patterns.filter(p => !d.patterns.some(x => x.id === p.id));
    state.settings.employmentDefaults = JSON.parse(JSON.stringify(d.employmentDefaults));
    state.settings.breakTiers = JSON.parse(JSON.stringify(d.breakTiers));
    state.settings.fuyou = { limitYen: d.fuyouLimit };
    state.patterns = JSON.parse(JSON.stringify(d.patterns));
    d.stores.forEach(s => { const st = storeOf(s.id); if(st) st.patternIds = s.patternIds.slice(); });

    // 削除されたパターンの後始末(時刻は消さずに残す)
    removed.forEach(p => {
      state.shifts.forEach(s => { if(s.patternId === p.id) s.patternId = null; });
      state.requests.forEach(r => {
        if(r.type === "pattern" && r.patternId === p.id){
          r.type = "time"; r.start = p.start; r.end = p.end; r.patternId = null;
        }
      });
      Object.keys(state.conditions).forEach(k => {
        const c = state.conditions[k];
        if(c && c.patternRatio) delete c.patternRatio[p.id];
      });
    });
    saveState();
    ui.ownerScreen = "dash"; ui.setDraft = null;
    render(); toast("共通設定を保存しました");
  },

state = loadState();
try{ OLD_VIEW_KEYS.forEach(k => localStorage.removeItem(k)); }catch(e){}
try{
  const v = localStorage.getItem(VIEW_KEY);
  view = v ? JSON.parse(v) : null;
  // 参照切れ(リセット直後・退職・ロールや所属の変更後)の防御。
  // 所属店舗が必要な画面(店長/スタッフ)なのに店舗が無い場合も視点選択に戻す
  const vu = view ? userOf(view.userId) : null;
  if(view && (!vu || retired(vu))) view = null;
  if(view){
    const md = uiModeOf(vu);
    if((md === "manager" || md === "staff") && !storeOf(vu.storeId)) view = null;
  }
  // 無効になった視点は端末からも消す(残しておくと壊れた値が localStorage に居座り続ける)
  if(!view && v) saveView();
}catch(e){ view = null; }
// ブラウザのメニューやCtrl+Pから印刷された場合も出力日時を最新にする
window.addEventListener("beforeprint", stampNow);
render();
</script>
</body>
</html>
