        <span class="small muted">空欄＝制限なし</span></div>
      <div class="frow"><label>出勤可能曜日</label></div>
      <div class="chk-grid" style="margin-bottom:10px;">${dowChks}</div>
      <div class="frow"><label>時給</label>
        <input type="number" id="us-wage" min="0" max="100000" step="10" style="width:100px;" value="${u.wage ?? ""}" placeholder="空=なし"> 円</div>
      <div class="frow"><label>年初〜先月の累計額</label>
        <input type="number" id="us-ytd" min="0" max="99999999" step="1000" style="width:130px;" value="${u.ytdYen ?? 0}"> 円</div>
      <div class="frow"><label>扶養の区分</label>
        <select class="tsel" id="us-dep">
          <option value="in" ${dep?"selected":""}>扶養内（計算・警告の対象）</option>
          <option value="out" ${dep?"":"selected"}>扶養外（対象外）</option>
        </select></div>
      <p class="small muted" style="margin:0 0 10px;">休憩は個人ごとには設定しません（パターンの設定 → 無ければ休憩の自動ルール、の2段階で決まります）。</p>
      <button class="btn btn-lg btn-primary" onclick="A.saveUser(${userId})">保存する</button>`);
  },
  saveUser(userId){
    const u = userOf(userId); if(!u) return;
    const type = document.getElementById("us-type").value;
    const wk   = document.getElementById("us-week").value.trim();
    const wage = document.getElementById("us-wage").value.trim();
    const ytd  = document.getElementById("us-ytd").value.trim();
    const dep  = document.getElementById("us-dep").value === "in";
    const days = DOWK.filter(k => { const el = document.getElementById("us-dow-" + k); return el && el.checked; });
    if(wk !== ""){
      const n = Number(wk);
      if(!isFinite(n) || n < 1 || n > 7){ toast("週の最大勤務日数は1〜7日で入力してください"); return; }
    }
    if(!days.length){ toast("出勤可能曜日を1つ以上選んでください"); return; }
    if(wage !== ""){
      const n = Number(wage);
      if(!isFinite(n) || n < 0 || n > 100000){ toast("時給は0〜100,000円で入力してください"); return; }
    }
    const yn = ytd === "" ? 0 : Number(ytd);
    if(!isFinite(yn) || yn < 0 || yn > 99999999){ toast("累計額は0〜99,999,999円で入力してください"); return; }

    u.type = type;
    u.weeklyMaxDays = wk === "" ? null : Number(wk);
    u.availableDays = days.length === 7 ? null : days;   // 全曜日可なら制限なしとして持つ
    u.wage = wage === "" ? null : Number(wage);
    u.ytdYen = yn;
    u.dependent = dep;
    saveState(); closeModal(); render();
    toast(`${u.name}さんの個人設定を保存しました`);
  },

  /* ----- 共通設定(全店舗) ----- */
  // 編集中は下書き(ui.setDraft)に溜め、「保存する」で初めて state に反映する
  openCommonSettings(){
    ui.ownerScreen = "settings";
    ui.setDraft = {
      employmentDefaults: JSON.parse(JSON.stringify(state.settings.employmentDefaults)),
      breakTiers: JSON.parse(JSON.stringify(breakTiersIn(state))),
      fuyouLimit: fuyouLimit(),
      patterns: JSON.parse(JSON.stringify(state.patterns)),
      stores: state.stores.map(s => ({ id:s.id, name:s.name, mode:s.mode, color:s.color, patternIds:(s.patternIds||[]).slice() }))
    };
    render();
  },
  // 雇用形態は名前でなくインデックスで受け取る(名前をJS文字列に埋め込まない)
  empField(idx, key, val){
    const t = Object.keys(ui.setDraft.employmentDefaults)[idx];
    const e = t != null ? ui.setDraft.employmentDefaults[t] : null; if(!e) return;
    const n = Number(val);
    if(!isFinite(n) || n <= 0){ toast("実働時間は0時間より大きい値を入力してください"); render(); return; }
    // 上限を超える値はグリッド・CSVに異常な時刻を出すのでここで止める
    if(n * 60 > MAX_WORK_MIN){ toast(`実働時間は${MAX_WORK_MIN/60}時間までです`); render(); return; }
    if(key === "work") e.workMin = Math.round(n * 60);
    render();
  },
  // 休憩の段階制ルール(拘束の閾値・休憩分)を編集する
  tierField(i, key, val){
    const t = ui.setDraft.breakTiers[i]; if(!t) return;
    const n = Number(val);
    if(!isFinite(n) || n < 0){ render(); return; }
    if(key === "break"){
      // 上限なしだと最終段(上限なしの段)に極端な値が入り、実働がマイナスのシフトができる
      if(n > MAX_BREAK_MIN){ toast(`休憩は${MAX_BREAK_MIN}分までです`); render(); return; }
      t.breakMin = Math.round(n);
    }
    else if(t.spanMaxMin != null){
      const h = key === "h" ? Math.round(n) : Math.floor(t.spanMaxMin / 60);
      const mm = key === "m" ? Math.round(n) : t.spanMaxMin % 60;
      t.spanMaxMin = Math.min(24*60, h * 60 + mm);
    }
    render();
  },
  fuyouLimitField(val){
    const n = Number(val);
    if(!isFinite(n) || n < 0){ render(); return; }
    ui.setDraft.fuyouLimit = Math.round(n);
  },
  storePat(storeId, patId, checked){
    const st = ui.setDraft.stores.find(s => s.id === storeId); if(!st) return;
    st.patternIds = st.patternIds.filter(id => id !== patId);
    // 表示順はパターン一覧の並びに合わせる
    if(checked) st.patternIds = ui.setDraft.patterns.filter(p => p.id === patId || st.patternIds.includes(p.id)).map(p => p.id);
    render();
  },
  editPattern(id){
    const d = ui.setDraft;
    const p = id != null ? d.patterns.find(x => x.id === id) : null;
    const cur = p || { name:"", start:"09:00", end:"17:00", breakMin:null, color:"#F2B441" };
    const auto = cur.breakMin == null;
    const autoMin = breakByTiers(d.breakTiers, tm(cur.end) - tm(cur.start));
    openModal(`${mdlHead(p ? "パターンを編集" : "パターンを追加")}
      <div class="frow"><label>名前</label>
        <input type="text" id="pt-name" value="${esc(cur.name)}" placeholder="例: A ／ 早番" maxlength="12"></div>
      <div class="frow"><label>時間（拘束）</label>
        ${timeSel("A.patBreakRefresh()", cur.start).replace("<select", '<select id="pt-start"')} 〜 ${timeSel("A.patBreakRefresh()", cur.end).replace("<select", '<select id="pt-end"')}</div>
      <div class="frow"><label>休憩</label>
        <select class="tsel" id="pt-break-mode" onchange="A.patBreakMode(this.value)">
          <option value="auto" ${auto?"selected":""}>自動（ルールで決める）</option>
          <option value="manual" ${auto?"":"selected"}>手動で指定</option>
        </select>
        <span id="pt-break-manual" style="${auto?"display:none;":""}">
          <input type="number" id="pt-break" min="0" max="240" step="5" value="${auto?autoMin:cur.breakMin}"> 分</span>
        <span id="pt-break-auto" class="small muted" style="${auto?"":"display:none;"}">この拘束時間なら ${autoMin}分（休憩の自動ルール）</span>
      </div>
      <div class="frow"><label>色</label><input type="color" id="pt-color" value="${cur.color}"></div>
      <p class="small muted" style="margin:0 0 10px;">「自動」は共通設定の<b>休憩の自動ルール（段階制）</b>で決まります。「手動」なら0分も明示的に指定できます。</p>
      <button class="btn btn-lg btn-primary" onclick="A.savePattern(${p ? p.id : "null"})">保存する</button>`);
  },
  // 休憩の 自動/手動 切替(モーダル内の表示だけ差し替える)
  patBreakMode(mode){
    const man = document.getElementById("pt-break-manual");
    const aut = document.getElementById("pt-break-auto");
    if(!man || !aut) return;
    if(mode === "auto"){
      const s = document.getElementById("pt-start").value, e = document.getElementById("pt-end").value;
      const n = tm(e) > tm(s) ? breakByTiers(ui.setDraft.breakTiers, tm(e) - tm(s)) : 0;
      aut.textContent = `この拘束時間なら ${n}分（休憩の自動ルール）`;
      man.style.display = "none"; aut.style.display = "";
    }else{
      man.style.display = ""; aut.style.display = "none";
    }
  },
  patBreakRefresh(){
    const sel = document.getElementById("pt-break-mode");
    if(sel) this.patBreakMode(sel.value);
  },
  savePattern(id){
    const d = ui.setDraft;
    const name = document.getElementById("pt-name").value.trim();
    const s = document.getElementById("pt-start").value;
    const e = document.getElementById("pt-end").value;
    const auto = document.getElementById("pt-break-mode").value === "auto";
    const br = auto ? null : Number(document.getElementById("pt-break").value);
    const color = document.getElementById("pt-color").value;
    if(!name){ toast("パターン名を入力してください"); return; }
    if(tm(e) <= tm(s)){ toast("終了時刻は開始時刻より後にしてください"); return; }
    if(!auto){
      if(!isFinite(br) || br < 0){ toast("休憩は0分以上で入力してください"); return; }
      if(br >= tm(e) - tm(s)){ toast("休憩が拘束時間以上です（実働が0になります）"); return; }
    }
    if(d.patterns.some(p => p.name === name && p.id !== id)){ toast("同じ名前のパターンがあります"); return; }
    if(id != null){
      const p = d.patterns.find(x => x.id === id);
      p.name = name; p.start = s; p.end = e; p.breakMin = auto ? null : br; p.color = color;
    }else{
      // 既存のシフト・希望が参照しているIDと衝突しないよう連番から採番する
      d.patterns.push({ id: state.seq++, name, start:s, end:e, breakMin: auto ? null : br, color });
    }
    // 手動休憩が自動ルールを下回る場合は保存は通すが警告する(明示の上書きなので止めはしない)
    const need = auto ? 0 : breakByTiers(d.breakTiers, tm(e) - tm(s));
    closeModal(); render();
    if(!auto && br < need)
      toast(`⚠ 休憩${br}分は自動ルール（この拘束時間なら${need}分）を下回ります。労働基準法の休憩を確認してください`);
  },
  askDelPattern(id){
    const p = ui.setDraft.patterns.find(x => x.id === id); if(!p) return;
    const shN  = state.shifts.filter(s => s.patternId === id).length;
    const pubN = state.shifts.filter(s => s.patternId === id && s.status === "published").length;
    const rqN  = state.requests.filter(r => r.type === "pattern" && r.patternId === id).length;
    const warn = (shN || rqN)
      ? `<p class="small">このパターンは<b>作成済みシフト${shN}件</b>（うち<b>公開済み ${pubN}件</b>）・<b>提出済みの希望${rqN}件</b>で使われています。<br>
         <b>公開済みのシフトも対象です。</b>削除しても時刻は残りますが、スタッフのカレンダーの表示が
         「${esc(p.name)}」から「${p.start}-${p.end}」（時刻のみ）に変わります（希望は時間指定に変わります）。<br>
         <b>この操作は元に戻せません。</b></p>`
      : `<p class="small">このパターンはまだ使われていません。<br><b>この操作は元に戻せません。</b></p>`;
    openModal(`${mdlHead("パターンを削除")}
      <p class="small"><b>${esc(p.name)}（${p.start}〜${p.end}）</b>を削除します。</p>${warn}
      <div class="opt-grid">
        <button class="btn btn-lg btn-danger" onclick="A.delPattern(${id})">削除する</button>
        <button class="btn btn-lg" onclick="A.closeModal()">キャンセル</button>
      </div>`);
  },
  delPattern(id){
    const d = ui.setDraft;
    d.patterns = d.patterns.filter(p => p.id !== id);
    d.stores.forEach(s => s.patternIds = s.patternIds.filter(pid => pid !== id));
    closeModal(); render();
  },
  saveCommonSettings(){
    const d = ui.setDraft;
    // 雇用形態の既定: 実働0時間は自動生成が破綻する。上限を超えると異常な時刻のシフトができる
    const badEmp = Object.keys(d.employmentDefaults).find(t => !(d.employmentDefaults[t].workMin > 0));
    if(badEmp){ toast(`${badEmp}の実働時間を0時間より大きくしてください`); return; }
    const overEmp = Object.keys(d.employmentDefaults).find(t => d.employmentDefaults[t].workMin > MAX_WORK_MIN);
    if(overEmp){ toast(`${overEmp}の実働時間は${MAX_WORK_MIN/60}時間までです`); return; }
    // 休憩の段階制ルール: 閾値は昇順・休憩は拘束より短いこと(実働が0以下にならない)
    const tiers = d.breakTiers;
    for(let i = 0; i < tiers.length; i++){
      const t = tiers[i];
      // 休憩分は全段で検証する(最終段=上限なしの段もここを通す。素通りすると実働がマイナスになる)
      if(!(t.breakMin >= 0) || t.breakMin > MAX_BREAK_MIN){
        toast(`休憩ルール${i+1}段目の休憩は0〜${MAX_BREAK_MIN}分で入力してください`); return;
      }
      if(t.spanMaxMin != null){
        if(!(t.spanMaxMin > 0)){ toast(`休憩ルール${i+1}段目の拘束時間を入力してください`); return; }
        const prev = i > 0 ? tiers[i-1].spanMaxMin : null;
        if(prev != null && t.spanMaxMin <= prev){ toast("休憩ルールの拘束時間は上から順に長くしてください"); return; }
        if(t.breakMin >= t.spanMaxMin){ toast(`休憩ルール${i+1}段目は休憩が拘束時間以上です`); return; }
      }
    }
    // パターン制の店舗はパターンが0だとシフトを組めない
    const badStore = d.stores.find(s => s.mode === "pattern" && !s.patternIds.length);
    if(badStore){ toast(`${badStore.name}（パターン制）は使用パターンを1つ以上選んでください`); return; }
    if(!(d.fuyouLimit > 0)){ toast("扶養の上限額を入力してください"); return; }

    const removed = state.patterns.filter(p => !d.patterns.some(x => x.id === p.id));
    state.settings.employmentDefaults = JSON.parse(JSON.stringify(d.employmentDefaults));
    state.settings.breakTiers = JSON.parse(JSON.stringify(d.breakTiers));
    state.settings.fuyou = { limitYen: d.fuyouLimit };
    state.patterns = JSON.parse(JSON.stringify(d.patterns));
    d.stores.forEach(s => { const st = storeOf(s.id); if(st) st.patternIds = s.patternIds.slice(); });

    // 削除されたパターンの後始末(時刻は消さずに残す)
    removed.forEach(p => {
      state.shifts.forEach(s => { if(s.patternId === p.id) s.patternId = null; });
      state.requests.forEach(r => {
        if(r.type === "pattern" && r.patternId === p.id){
          r.type = "time"; r.start = p.start; r.end = p.end; r.patternId = null;
        }
      });
      Object.keys(state.conditions).forEach(k => {
        const c = state.conditions[k];
        if(c && c.patternRatio) delete c.patternRatio[p.id];
      });
    });
    saveState();
    ui.ownerScreen = "dash"; ui.setDraft = null;
    render(); toast("共通設定を保存しました");
  },

  /* ----- 設定 ----- */
  openSettings(){
    openModal(`${mdlHead("設定")}
      <p class="small muted">シフト作成システム 営業デモ版 v1.4<br>
      データはこの端末のブラウザ内（localStorage）にのみ保存されます。サーバー送信はありません。</p>
      <div class="opt-grid">
        <button class="btn btn-lg btn-danger" onclick="A.confirmReset()">🔄 デモデータにリセット</button>
      </div>`);
  },
  confirmReset(){
    openModal(`${mdlHead("デモデータにリセット")}
      <p class="small">提出した希望・作成したシフト・通知をすべて破棄して、初期のデモ状態に戻します。よろしいですか？</p>
      <div class="opt-grid">
        <button class="btn btn-lg btn-danger" onclick="A.doReset()">リセットする</button>
        <button class="btn btn-lg" onclick="A.closeModal()">キャンセル</button>
      </div>`);
  },
  doReset(){
    localStorage.removeItem(STATE_KEY);
    localStorage.removeItem(VIEW_KEY);
    state = loadState();
    view = null;
    closeModal(); render();
    toast("デモデータにリセットしました");
  }
};
window.A = A;

/* ---------------- boot ---------------- */
state = loadState();
try{
  const v = localStorage.getItem(VIEW_KEY);
  view = v ? JSON.parse(v) : null;
  // 参照切れ(リセット直後等)の防御
  if(view && view.role === "staff" && !userOf(view.userId)) view = null;
  if(view && view.role === "manager" && !storeOf(view.storeId)) view = null;
}catch(e){ view = null; }
// ブラウザのメニューやCtrl+Pから印刷された場合も出力日時を最新にする
window.addEventListener("beforeprint", stampNow);
render();
</script>
</body>
</html>
